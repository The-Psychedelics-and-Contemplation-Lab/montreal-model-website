 with sensory cortex, top-down influence falls, and sight and sound are weighted more. Anesthetic: default-mode and salience coordination break down, top-down influence is lowest, sensory networks are isolated.`,more:`Functional connectivity is the correlation over time of fMRI signals: a relationship, not wiring. With ketamine, connectivity fell within the frontoparietal and sensorimotor networks and rose between the default mode network and four others; LSD and nitrous oxide showed the same broad tendency (Dai 2023). Thalamus coupling with sensory cortex rose (Höflich 2015, 30 volunteers; Abram 2022, 18 men). Under unresponsiveness, default-mode coordination broke down, salience coordination was unevenly suppressed and sensory networks changed little (Bonhomme 2016, eight volunteers analysed); a larger study found several default-mode connections increased (Fleming 2019, 53 participants). In a modelled MEG measure frontal-to-parietal influence fell (Muthukumaraswamy 2015, 19 men), with no clear change in alpha-band EEG (Vlisides 2017); responses to violations of higher-level auditory regularities shrank, lower-level ones did not (Weber 2020). At loss of responsiveness frontal-to-parietal transfer was lowest, as under propofol and sevoflurane (Lee 2013, 30 patients).`},tips:{"x8-rowNet":{title:`Functional Networks (fMRI)`,body:`Regions whose activity rises and falls together form a network; a relationship, not wiring.`},"x8-rowFb":{title:`Top-Down Influences`,body:`How strongly frontal areas shape parietal and sensory processing; two different measures.`},"x8-rowIn":{title:`Sensory Input`,body:`How signals from the eyes and ears are weighted and placed, not their loudness.`},"x8-within-sub":{title:`Less Within, More Between`,body:`Frontoparietal and sensorimotor less within; default mode more with four others (Dai 2023).`},"x8-thal-sub":{title:`Thalamus–Sensory Coupling Up`,body:`The thalamus coupled more with sensory cortex (fMRI: Höflich 2015; Abram 2022).`},"x8-dmn-anes":{title:`Default Mode and Salience Break Down`,body:`Default-mode coordination broke down; salience unevenly weaker (Bonhomme 2016, eight volunteers).`},"x8-iso-anes":{title:`Sensory Networks Isolated`,body:`Auditory, visual and sensorimotor networks changed little while higher-order ones broke down (Bonhomme 2016).`},"x8-fb-sub":{title:`Top-Down Influence: Decreased`,body:`Down in modelled MEG (Muthukumaraswamy 2015); no clear change in alpha-band EEG (Vlisides 2017).`},"x8-fb-anes":{title:`Top-Down Influence: Lowest`,body:`Lowest at loss of responsiveness, as under propofol and sevoflurane (Lee 2013; Vlisides 2017).`},"x8-in-sub":{title:`Sensory Input: Weighted More`,body:`Signals still arrive while higher-level expectations weaken (Weber 2020): weighted more, not louder.`},"x8-in-anes":{title:`Sensory Input: Isolated`,body:`Unresponsive: the room no longer drives report or behaviour (Lee 2013; Bonhomme 2016).`},"x8-net-sub-DMN":{title:`Default Mode Network · With Ketamine`,body:`Solid ring: no significant change within; orange line: moved more with salience (Dai 2023).`},"x8-net-sub-SAL":{title:`Salience Network · With Ketamine`,body:`Solid ring: no significant change within; orange line: moved more with default mode (Dai 2023).`},"x8-net-anes-DMN":{title:`Default Mode Network · Unresponsive`,body:`Dimmed, dashed ring: coordination within broke down at unresponsiveness (Bonhomme 2016).`},"x8-net-anes-SAL":{title:`Salience Network · Unresponsive`,body:`Dimmed, dashed ring: coordination within broke down, unevenly (Bonhomme 2016).`},"x8-pair-none":{title:`Default Mode–Salience: Reference`,body:`Their coordination at the waking reference; the line’s placement is schematic.`},"x8-pair-sub":{title:`Default Mode–Salience: More Between`,body:`These networks moved more together with ketamine (Dai 2023); placement schematic.`},"x8-pair-anes":{title:`Default Mode–Salience: Not Assessed`,body:`Bonhomme 2016 did not assess this pair under anesthesia; placement schematic.`},"x8-arc-none":{title:`Frontal → Parietal Influence`,body:`Frontal areas shape how parietal areas interpret input; the arc’s placement is schematic.`},"x8-eye":{title:`The Eyes`,body:`Sight from the room; the arrow enters visual cortex at the back of the brain.`},"x8-ear":{title:`The Ears`,body:`Sound from the room; the arrow enters auditory cortex in the superior temporal gyrus.`},"x8-sight-none":{title:`Sight: Into Visual Cortex`,body:`Signals from the eyes reach occipital (visual) cortex: the waking reference, schematic.`},"x8-sound-none":{title:`Sound: Into Auditory Cortex`,body:`Signals from the ears reach the superior temporal gyrus: the waking reference, schematic.`},"x8-sight-sub":{title:`Sight: Weighted More (Schematic)`,body:`The balance shift drawn for sight too; the measured case is hearing (Weber 2020).`},"x8-sound-sub":{title:`Sound: Weighted More, Not Louder`,body:`Higher-level auditory expectations weakened; lower-level responses did not (Weber 2020).`},"x8-sight-anes":{title:`Sight: Cut Off`,body:`Unresponsive: the room no longer drives report or behaviour (Lee 2013).`},"x8-sound-anes":{title:`Sound: Cut Off`,body:`Sensory networks stay coherent but isolated (Bonhomme 2016); the room no longer reaches report.`},"x8-lg-ring":{title:`Ring: Coordination Within a Network`,body:`Solid at reference and subanesthetic doses; dimmed, dashed at anesthetic doses: broke down (Bonhomme 2016).`},"x8-lg-pair":{title:`Line: Default Mode–Salience`,body:`Slate at reference, orange where they coordinated more (Dai 2023), dotted: not assessed under anesthesia.`},"x8-lg-arc":{title:`Arc: Frontal-to-Parietal Influence`,body:`Solid at reference; thin and dashed: decreased (modelled MEG); broken: lowest, not absent.`},"x8-lg-thal":{title:`Thalamus–Sensory Coupling`,body:`Slate at reference; orange and thicker: coupled more (Höflich 2015; Abram 2022); dotted: not assessed.`},"x8-lg-warm":{title:`Warm: Sensory Areas`,body:`Touch, hearing and sight areas: warm with ket onds to the room (Sanders 2012).`},"b9-p-ext":{title:`Influence of External Stimuli`,body:`How much the room, its sounds and the setting shape what is experienced.`},"b9-cv-perc":{title:`Curve: Perceptual Changes`,body:`Schematic: rises with the dose, from ordinary to vivid dreams; not measured.`},"b9-cv-int":{title:`Curve: Interactivity`,body:`Schematic: falls with the dose, from full to lost; not measured.`},"b9-cv-ext":{title:`Curve: External Stimuli`,body:`Schematic: peaks at subanesthetic doses, then falls below the baseline; not measured.`},"b9-base":{title:`Dashed Line: Baseline`,body:`The setting’s ordinary influence without ketamine: the bottom plot’s reference.`},"b9-yax":{title:`Vertical Axis: More`,body:`Higher means more of what the plot names; no scale and no units.`},"b9-i-ord":{title:`Ordinary`,body:`Waking perception that follows the surroundings: the reference.`},"b9-i-dream":{title:`Dream-like Imagery, Shaped by the Setting`,body:`Eyes closed bring imagery and dream-like scenes; eyes open, distortions only.`},"b9-i-vivid":{title:`Vivid Dreams, Not About the Room`,body:`All six volunteers reported dreams unrelated to the room; none under propofol or xenon.`},"b9-c-full":{title:`Full`,body:`Awake without ketamine: perceives and responds to the room.`},"b9-c-dec":{title:`Decreased but Present`,body:`Speaks and responds, slowed; reality testing intact at lower concentrations (Dávila 2025).`},"b9-c-lost":{title:`Lost`,body:`Minimally responsive to voice, touch and the room (Sinner and Graf 2008).`},"b9-lost-anes":{title:`Hence the Term ‘Dissociation’`,body:`Cut off from the room, so it looks dissociated; inside, people are dreaming.`},"b9-e-base":{title:`Baseline`,body:`Without ketamine, perception is shaped by the surroundings in the ordinary way.`},"b9-e-strong":{title:`Strong`,body:`Set and setting shape the experience, as with psychedelics; eyes open or closed matters.`},"b9-e-below":{title:`Below Baseline`,body:`The setting matters much less; the dreams are not about the room.`},"b9-axis":{title:`Dose Axis`,body:`Three ordinal positions shared by the three plots: no numbers, no units.`},"b9-ax-none":{title:`No Ketamine`,body:`The waking reference for all three plots.`},"b9-ax-sub":{title:`Subanesthetic`,body:`Awake and slowed; the experience strongly shaped by the setting.`},"b9-ax-anes":{title:`Anesthetic`,body:`Unresponsive to the room; inside, vivid dreams not about it.`},"b9-cur-none":{title:`Cursor: No Ketamine`,body:`All three plots at the waking reference.`},"b9-cur-sub":{title:`Cursor: Subanesthetic`,body:`Perception dream-like, interactivity decreased but present, the setting’s influence strongest.`},"b9-cur-anes":{title:`Cursor: Anesthetic`,body:`Vivid dreams inside, interactivity lost, the setting’s influence below baseline.`},"b9-k-curve":{title:`Curves: Schematic`,body:`Shapes drawn to match the reports at each dose; not measurements.`},"b9-k-cursor":{title:`Cursor: Chosen Dose`,body:`The vertical line marks the chosen dose; the dots mark each curve there.`},"b9-k-base":{title:`Dashed: Baseline`,body:`The dashed line marks the setting’s ordinary influence, without ketamine.`},"b9-obs":{title:`What the Observer Sees`,body:`The person from outside: short descriptions of behaviour, not measured postures.`},"b9-o-none":{title:`Awake and Responsive`,body:`The reference: speaks and answers at an ordinary pace.`},"b9-o-refchip":{title:`The Reference`,body:`Choose a dose to see how an observer’s view changes.`},"b9-o-awake":{title:`Awake`,body:`Awake throughout at subanesthetic doses.`},"b9-o-slow":{title:`Slowed`,body:`Speaks and responds, but more slowly.`},"b9-o-eyes":{title:`Eyes Often Closed`,body:`Often closed, which brings imagery; with the eyes open, distortions only.`},"b9-o-answer":{title:`Can Answer`,body:`Responds to questions: interactivity decreased but present.`},"b9-o-unresp":{title:`Unresponsive to Voice and Touch`,body:`No purposeful response to the room: minimally responsive (Sinner and Graf 2008).`},"b9-o-gaze":{title:`Eyes May Be Open, Gaze Wandering`,body:`The eyes often stay open with a wandering gaze (Sinner and Graf 2008).`},"b9-o-reflex":{title:`Reflexes Kept`,body:`Reflexes largely kept under ketamine anesthesia (Sinner and Graf 2008).`},"b9-o-looks":{title:`Looks ‘Dissociated’; Inside, Dreaming`,body:`Hence the term ‘dissociation’; yet vivid dreams are common inside (Sarasso 2015).`},"b9-shapes":{title:`What Shapes It: Set and Setting`,body:`The person’s expectations and surroundings change what the experience contains.`},"b9-s-eyes":{title:`Eyes Open or Closed: A Big Difference`,body:`Whether the eyes are open or closed changes the reports a great deal.`},"b9-s-open":{title:`Eyes Open: Distortions Only`,body:`Structured testing, eyes open: distortions without formed hallucinations (Pomarol-Clotet 2006).`},"b9-s-closed":{title:`Eyes Closed: Complex Imagery`,body:`Eyes closed: complex imagery and sound–colour blending (Vlisides 2018; Farnes 2020).`},"b9-s-scan":{title:`Scanner: Voices and Music`,body:`In a scanner, vivid heard voices and music at ordinary doses (Powers 2015).`},"b9-s-mask":{title:`Eye Mask and Music`,body:`Richer, more meaningful experience for many; no clear change in antidepressant effect (Kheirkhah 2025).`},"b9-dav":{title:`As the Dose Rises`,body:`The order of reported changes up to unresponsiveness, in six men (Dávila 2025).`},"b9-dav-1":{title:`Altered Body`,body:`Reported first: the body feels changed.`},"b9-dav-2":{title:`Floating, Reality Testing Intact`,body:`A floating feeling while still knowing what is real.`},"b9-dav-3":{title:`Imagery Like the Room`,body:`Imagery that could not be told apart from the room.`},"b9-dav-4":{title:`Unresponsive`,body:`Then no response to the room: the anesthetic range.`},"b9-f-sar":{title:`Recalled on Waking`,body:`The dreams were reported afterwards, so none can be tied to a moment.`},"b9-f-sik":{title:`Recall Depends on Timing`,body:`Across 157 studies, recall depended largel >{var t=lf();De(2),W(e,t)},c=e=>{var t=uf();De(),W(e,t)};K(o,e=>{H(n)===0?e(s):e(c,-1)}),M(a);var l=B(a),u=z(l),d=B(l),f=z(B(d),!0);M(i),M(r),V(()=>{Z(r,`data-tip`,H(t).tip),G(u,`${H(t).head??``}:`),G(d,` ${H(t).body??``}`),G(f,H(t).cite)}),W(e,r)}),M(ye),M(ge);var be=B(ge,2);J(be,21,()=>n.shapes.cards,e=>e.tip,(e,t)=>{var n=ff(),r=L(n),i=z(r,!0),a=B(r,2),o=L(a,!0),s=z(B(o),!0);M(a),M(n),V(()=>{Z(n,`data-tip`,H(t).tip),G(i,H(t).head),G(o,H(t).body),G(s,H(t).cite)}),W(e,n)}),M(be),M(he),M(ue),M(le);var xe=B(le),Se=L(xe),j=L(Se);J(j,21,()=>n.foot,e=>e.tip,(e,t)=>{var n=pf(),r=L(n),i=z(r,!0),a=z(B(r,2),!0);M(n),V(()=>{Z(n,`data-tip`,H(t).tip),G(i,H(t).head),G(a,H(t).body)}),W(e,n)}),M(j),M(Se),M(xe),M(u),V(e=>{Z(u,`data-dose`,t.dose),d=X(u,``,d,{opacity:e}),G(p,n.tag),Z(_,`data-tip`,n.axis.tip),Z(x,`data-tip`,n.axis.tip),G(S,n.axis.name),Y(C,0,`cur d-${t.dose??``}`,`svelte-mg6kex`),X(C,`--x0:${i.none??``}px; transform: translateX(${i[t.dose]??``}px)`),Z(C,`data-tip`,n.cursorTip[t.dose]),Z(O,`data-tip`,n.stages.tip),G(A,n.stages.name),G(ee,n.stages.lead),Z(ie,`data-tip`,n.observer.tip),G(oe,n.observer.name),G(se,n.observer.sub),Z(de,`data-tip`,n.shapes.tip),G(pe,n.shapes.name),G(me,n.shapes.sub),Z(ge,`data-tip`,n.shapes.eyes.tip),G(ve,n.shapes.eyes.head)},[()=>t.ann.toFixed(3)]),W(e,u),Xe()}var gf={text:Hd,def:{look:`free`,Scene:hf}},_f={step:{id:`e-chameleon`,nav:`The Chameleon`,title:`Not Quite Psychedelic, Not Quite Anesthetic: The Ketamine Chameleon`,body:`Ketamine overlaps with both. At subanesthetic doses its brain state and experiences resemble those of serotonergic psychedelics, reached by a different receptor and with more disembodiment. At anesthetic doses it ends responsiveness like other anesthetics but leaves the cortex active and dreaming.`,more:`Each cell comes from separate studies, so the table compares categories, not amounts. Subanesthetic ketamine and LSD both shifted networks towards less coordination within and more between (Dai 2023), and signal diversity rose with ketamine, LSD and psilocybin (Schartner 2017). Under LSD, blood flow changed by region and rose in visual cortex (Carhart-Harris 2016) and global connectivity rose (Tagliazucchi 2016). Psilocybin and ketamine overlap in altered states, with more visual illusions under psilocybin (Vollenweider 2001), and less disembodiment under serotonergic psychedelics (Marguilho 2023). Both drug classes promote synapse growth in animals (Li 2010; Autry 2011; Ly 2018). Under anesthesia, propofol roughly halved brain metabolism (Alkire 1995) and brought large slow waves (Purdon 2015); frontoparietal communication was lost (Lee 2013); ketamine volunteers dreamed where propofol and xenon volunteers did not (Sarasso 2015).`},tips:{"c10-colSubK":{title:`Subanesthetic Ketamine`,body:`Tinted as ketamine: below the anesthetic range, as in depression treatment.`},"c10-colPsy":{title:`Serotonergic Psychedelic`,body:`LSD, psilocybin and similar drugs, which act at serotonin 2A receptors.`},"c10-colAnesK":{title:`Anesthetic Ketamine`,body:`Tinted as ketamine: doses that end responsiveness, as in surgery.`},"c10-colOther":{title:`Other Anesthetics`,body:`Propofol, sevoflurane and xenon: the usual comparisons in these studies.`},"c10-bPharm":{title:`Pharmacology`,body:`What the drug does at receptors and synapses.`},"c10-bBrain":{title:`Brain`,body:`What is measured across the brain: flow, rhythms, networks, sensory input.`},"c10-bPerson":{title:`Person`,body:`What an observer sees and what the person experiences.`},"c10-rPharm":{title:`Pharmacological Effects`,body:`Two receptor routes: NMDA block for ketamine, serotonin 2A for psychedelics.`},"c10-rPlast":{title:`Neuroplasticity`,body:`Growth of synapses and its signals, shown mainly in animals.`},"c10-rFlow":{title:`Blood Flow`,body:`Ketamine raises flow at both doses; propofol lowers it with metabolism.`},"c10-rEeg":{title:`Electrical Activity`,body:`Alpha falls with ketamine and psychedelics; propofol brings large slow waves.`},"c10-rNet":{title:`Functional Networks`,body:`Ketamine and LSD shift coordination alike; anesthesia breaks networks down.`},"c10-rSens":{title:`Sensory Input`,body:`Weighted more at low doses; isolated or cut off under anesthesia.`},"c10-rInter":{title:`Interactivity`,body:`Responsiveness to the room: kept at low doses, lost under anesthesia.`},"c10-rExp":{title:`Experience`,body:`Similar with psychedelics; under anesthesia, ketamine alone leaves dreams to recall.`},"c10-dissoc":{title:`Lost, Hence “Dissociation”`,body:`Unresponsive to the room, hence the term; inside, vivid dreams.`},"c10-plastSubK":{title:`BDNF and Synapse Growth`,body:`More BDNF and new synapses in rodents (Li 2010; Autry 2011).`},"c10-plastPsy":{title:`Psychoplastogens`,body:`Psychedelics promote synapse growth in cultured neurons and rodents (Ly 2018).`},"c10-tox":{title:`Unclear, Potentially Neurotoxic`,body:`Harm seen with heavy or prolonged exposure, beyond clinical use (Diep 2025 §6.3).`},"c10-toxOther":{title:`Potentially Neurotoxic: Developing Brain`,body:`In rat pups, midazolam, nitrous oxide and isoflurane caused widespread neurodegeneration (Jevtovic-Todorovic 2003).`},"c10-flowPsy":{title:`Region-Dependent Blood Flow`,body:`Psilocybin lowered hub-region blood flow (Carhart-Harris 2012); LSD raised visual-cortex flow (Carhart-Harris 2016).`},"c10-flowOther":{title:`Decreased With Metabolism`,body:`Propofol anesthesia roughly halved whole-brain glucose metabolism (Alkire 1995).`},"c10-eegPsy":{title:`Alpha Down; Diversity Up`,body:`LSD and psilocybin lowered alpha and raised signal diversity, as ketamine did (Schartner 2017).`},"c10-eegOther":{title:`Slow Waves, Frontal Alpha, Low Complexity`,body:`Under propofol: large slow waves, frontal alpha (Purdon 2015); complexity falls (Sarasso 2015).`},"c10-netSubK":{title:`Less Within, More Between`,body:`Within-network coordination fell, between rose; thalamus–sensory coupling up (Dai 2023; Höflich 2015).`},"c10-netPsy":{title:`The Same Tendency; Global Connectivity Up`,body:`The same tendency under LSD (Dai 2023); global connectivity rose (Tagliazucchi 2016).`},"c10-netAnesK":{title:`Default Mode and Salience Break Down`,body:`Higher-order networks broke down; sensory networks stayed coherent but isolated (Bonhomme 2016).`},"c10-netOther":{title:`Frontoparietal Communication Lost`,body:`Frontal-to-parietal transfer was lowest at loss of responsiveness under propofol and sevoflurane (Lee 2013).`},"c10-expPsy":{title:`Similar, More Visual Illusions`,body:`More visual illusions (Vollenweider 2001); less disembodiment than with ketamine (Marguilho 2023).`},"c10-expAnesK":{title:`Vivid Dreams, Not About the Room`,body:`All six volunteers dreamed (Sarasso 2015); recall 44–100 per cent in experiments (Sikka 2026).`},"c10-expOther":{title:`Experience Rarely Recalled`,body:`None of twelve given propofol or xenon recalled any experience (Sarasso 2015).`},"c10-phSubK":{title:`NMDA Antagonism, Glutamate Up`,body:`In the model interneurons are blocked first, so glutamate release rises (Moghaddam 1997).`},"c10-phPsy":{title:`Serotonin 2A Agonism`,body:`LSD and psilocybin activate serotonin 2A receptors, exciting the cortex (Vollenweider 2001).`},"c10-phAnesK":{title:`NMDA Antagonism, Glutamate Down`,body:`The block is no longer selective, and glutamate release falls (Moghaddam 1997, rats).`},"c10-phOther":{title:`GABA-A Enhancement; Xenon at NMDA`,body:`Propofol and sevoflurane enhance GABA-A receptors; xenon, like ketamine, acts at NMDA receptors.`},"c10-flowSubK":{title:`Blood Flow Increased`,body:`Blood flow rose at subanesthetic doses, measured with PET (Långsjö 2003).`},"c10-flowAnesK":{title:`Increased, Beyond Metabolic Needs`,body:`Under anesthetic S-ketamine, flow rose beyond what metabolism required (Långsjö 2005).`},"c10-eegSubK":{title:`Alpha Down; Gamma and Diversity Up`,body:`Less alpha, more gamma, more varied signals (Muthukumaraswamy 2015; Schartner 2017).`},"c10-eegAnesK":{title:`Gamma Bursts; Diversity Fluctuates`,body:`Gamma bursts between slow waves (Akeju 2016); complexity alternates (Li and Mashour 2019).`},"c10-sensSubK":{title:`Weighted More`,body:`Higher-level expectations weaken, so input weighs more (Weber 2020); top-down influence falls.`},"c10-sensPsy":{title:`Priors Relaxed`,body:`The psychedelic account: expectations relax and the visual system is strongly driven.`},"c10-sensAnesK":{title:`Isolated; Feedback Lowest`,body:`Sensory networks isolated (Bonhomme 2016); frontal-to-parietal feedback lowest (Lee 2013).`},"c10-sensOther":{title:`Cut Off`,body:`Under propofol and sevoflurane the room no longer reaches report (Lee 2013).`},"c10-interSubK":{title:`Decreased but Present`,body:`People speak and respond, more slowly (Dávila 2025).`},"c10-interPsy":{title:`Present`,body:`People under psychedelics usually stay responsive and can talk.`},"c10-interOther":{title:`Lost`,body:`Unresponsive under propofol, sevoflurane or xenon anesthesia.`},"c10-expSubK":{title:`Complex Hallucinations, Disembodiment`,body:`Eyes covered: complex imagery; insight, disembodiment; set and setting shape it (Vlisides 2018; Kheirkhah 2025).`},"c10-ph-m1":{title:`Different: Pharmacological Effects`,body:`NMDA antagonism versus serotonin 2A agonism: different routes to overlapping results.`},"c10-ph-m2":{title:`Different: Pharmacological Effects`,body:`Propofol and sevoflurane act at GABA-A; only xenon shares ketamine’s NMDA target.`},"c10-np-m1":{title:`Similar: Neuroplasticity`,body:`Both promote plasticity signalling in preclinical work.`},"c10-np-m2":{title:`Similar: Neuroplasticity`,body:`Both raise neurotoxicity questions with exposure; the evidence differs.`},"c10-bf-m1":{title:`Similar: Blood Flow`,body:`Both raise flow somewhere; ketamine’s rise is broad, LSD’s depends on region.`},"c10-bf-m2":{title:`Different: Blood Flow`,body:`Ketamine raises blood flow; propofol lowers it along with metabolism.`},"c10-ea-m1":{title:`Same: Electrical Activity`,body:`Alpha falls and signal diversity rises under both.`},"c10-ea-m2":{title:`Different: Electrical Activity`,body:`Gamma bursts and fluctuating diversity, against slow waves and low complexity.`},"c10-fn-m1":{title:`Same: Functional Networks`,body:`Less within and more between networks under both (Dai 2023).`},"c10-fn-m2":{title:`Similar: Functional Networks`,body:`Both lose long-range coordination; which networks break down differs.`},"c10-si-m1":{title:`Similar: Sensory Input`,body:`Both loosen the hold of expectations, so sensory input weighs more.`},"c10-si-m2":{title:`Same: Sensory Input`,body:`Under both, the room no longer reaches report.`},"c10-ia-m1":{title:`Similar: Interactivity`,body:`Both keep people responsive; ketamine slows them more.`},"c10-ia-m2":{title:`Same: Interactivity`,body:`Responsiveness is lost under both.`},"c10-ex-m1":{title:`Similar: Experience`,body:`Overlapping experiences; ketamine alters the body more, psilocybin vision more.`},"c10-ex-m2":{title:`Different: Experience`,body:`Ketamine’s dreams are common; after other anesthetics, experience is rarely recalled.`}},note:[`comparison table (categories from separate studies, not amounts)`,`row brackets (a grouping for reading, not a finding)`,`same, similar and different symbols (a reading of each row, not a measured distance)`],extra:{cols:[{key:`subK`,head:`Subanesthetic Ketamine`,sub:`Ketamine`,tip:`c10-colSubK`,ket:!0},{key:`psy`,head:`Serotonergic Psychedelic`,sub:`LSD, Psilocybin`,tip:`c10-colPsy`,ket:!1},{key:`anesK`,head:`Anesthetic Ketamine`,sub:`Ketamine`,tip:`c10-colAnesK`,ket:!0},{key:`other`,head:`Other Anesthetics`,sub:`Propofol, Sevoflurane, Xenon`,tip:`c10-colOther`,ket:!1}],groups:[{name:`Pharmacology`,tip:`c10-bPharm`,rows:[{k:`ph`,name:`Pharmacological Effects`,tip:`c10-rPharm`,m:[`diff`,`diff`],cells:{subK:`NMDA antagonism; glutamate release rises (interneurons blocked first, in the model)`,psy:`Serotonin 2A agonism; cortical excitation`,anesK:`NMDA antagonism; glutamate release :`The review (Diep et al. 2025) reads ketamine through two frameworks: in the biomedical one its experiences are effects to manage; in the psychedelic one they are part of the treatment. It argues that “dissociation” became the dominant word through historical circumstance, and that research shows context-sensitive effects close to those of serotonergic psychedelics. Plasticity means changes in synaptic strength or number (Li 2010; Autry 2011, rodents). Neurotoxicity evidence comes from long-term heavy use (§6.3).`},tips:{"b11-bands":{title:`The Dose Axis`,body:`Effects change with dose; the bands overlap, and their widths are illustrative.`},"b11-band-a":{title:`Analgesia`,body:`At the lowest doses ketamine relieves pain; the band’s width is illustrative.`},"b11-band-b":{title:`Subanesthetic Doses`,body:`Psychedelic and dream-like: responsive but slowed, shaped by set and setting.`},"b11-band-c":{title:`Anesthetic Doses`,body:`Unresponsive to the room, hence ‘dissociative’; yet dreaming inside (Sarasso 2015).`},"b11-face-a":{title:`The Analgesic Face`,body:`At the lowest doses ketamine relieves pain.`},"b11-face-b":{title:`The Psychedelic, Dream-like Face`,body:`Responsive but slowed; set and setting shape it, as with psychedelics (slides 9–10).`},"b11-face-c":{title:`The Dissociative, Dream-like Face`,body:`Unresponsive to the room, hence ‘dissociative’; yet vivid dreams inside (Sarasso 2015).`},"b11-c1":{title:`An NMDA Antagonist in Two Clinics`,body:`A noncompetitive NMDA receptor antagonist, used in anesthesia and psychiatry (Diep 2025).`},"b11-c2":{title:`Two Frameworks`,body:`Biomedical and psychedelic views of ketamine; each overlaps partly with anesthesia (Diep 2025).`},"b11-c3":{title:`Different Practices`,body:`How experiences are understood, used, measured and explained differs by framework (Diep 2025).`},"b11-c4":{title:`A Label by Historical Accident`,body:`‘Dissociation’ won out by circumstance, not because it describes the experience best (Diep 2025).`},"b11-c5":{title:`Complex and Context-Sensitive`,body:`Neglected anesthesia studies included; effects depend strongly on setting and expectation (Diep 2025).`},"b11-c6":{title:`Language Has Consequences`,body:`Words shape care and research; the review makes cross-disciplinary recommendations (Diep 2025).`},"b11-r-sub":{title:`Across the Brain: Subanesthetic`,body:`Slides 7–9 at subanesthetic doses, in one sentence.`},"b11-r-anes":{title:`Across the Brain: Anesthetic`,body:`Slides 7–9 at anesthetic doses, in one sentence.`},"b11-plast":{title:`Plasticity`,body:`Changes in synaptic strength or number, shown mainly in rodents (Li 2010; Autry 2011).`},"b11-tox":{title:`Neurotoxicity`,body:`The evidence comes from long-term heavy use, far beyond clinical exposure (Diep 2025, §6.3).`}},note:[],extra:{faces:[{name:`Analgesic`,line:`Pain relief.`,tip:`b11-face-a`,band:`bandA`},{name:`Psychedelic and Dream-like`,line:`Responsive; setting shapes it.`,tip:`b11-face-b`,band:`bandB`},{name:`Dissociative and Dream-like`,line:`Unresponsive, yet dreaming inside.`,tip:`b11-face-c`,band:`bandC`}],pointsTag:`The Chameleon Review · Diep 2025`,points:[{n:1,tip:`b11-c1`,text:`An NMDA receptor antagonist used in anesthesia and psychiatry.`},{n:2,tip:`b11-c2`,text:`Seen through biomedical and psychedelic frameworks, each partly overlapping anesthesia.`},{n:3,tip:`b11-c3`,text:`The frameworks understand, use and measure the experiences differently.`},{n:4,tip:`b11-c4`,text:`‘Dissociation’ won out by historical accident; the anesthetic state is dreaming inside.`},{n:5,tip:`b11-c5`,text:`Effects are context-sensitive, with a kinship to psychedelics the term misses.`},{n:6,tip:`b11-c6`,text:`Words have consequences; the review recommends explanatory models, settings and preparation.`}],recap:[{tag:`Subanesthetic`,tip:`b11-r-sub`,body:`Glutamate, blood flow and signal diversity rise; networks coordinate less within, more between.`},{tag:`Anesthetic`,tip:`b11-r-anes`,body:`Glutamate release f w`,how:`people, PET`,tip:`rowFlow`,cells:{ref:`Reference`,sub:`↑ Increased`,anes:`↑ Increased`}}],note:`Oxygen use did not rise in step with blood flow. Directions only, not sizes.`,noteTip:`noteFlow`},tips:{patch:{title:`Illustrative Prefrontal Patch`,body:`The network of slides 2–6, placed for illustration; only how often its events occur changes.`},refWhole:{title:`No Ketamine`,body:`The reference: the same measures in the waking brain without the drug.`},rowModel:{title:`In the Circuit Model`,body:`Abdallah 2016’s GO and STOP account, mainly rodent work; the interneuron preference is proposed.`},rowGluRat:{title:`Extracellular Glutamate (Rats)`,body:`Microdialysis samples the glutamate outside cells in rat prefrontal cortex (Moghaddam 1997).`},rowFlow:{title:`Blood Flow (People)`,body:`PET in volunteers: blood flow rose at both doses (Långsjö 2003, 2005).`},noteFlow:{title:`Blood Flow Is Not Activity`,body:`Oxygen use did not keep pace with the rise in flow; arrows give directions only.`},wash07:{title:`Orange Wash: Blood Flow Up`,body:`PET found blood flow up at both doses; a direction, not a map of activity.`},washRef07:{title:`No Wash: Blood Flow at Reference`,body:`Without ketamine, blood flow is the waking reference, so the cortex stays neutral.`},"stip07-sub":{title:`Purple Dots: A Selective Block`,body:`In the model, a selective block: interneurons’ NMDA receptors and those outside synapses.`},"stip07-anes":{title:`Purple Dots: Block No Longer Selective`,body:`In the model, the block spreads: excitatory neurons’ synaptic receptors are blocked too.`},stipNone07:{title:`No Dots: No Receptor Block`,body:`Without ketamine no NMDA receptors are blocked, so no dots are drawn.`}},parcels:{body:()=>`Not coloured here: this slide’s measurements are stated in the panel, not mapped.`,byDose:{sub:()=>`Schematic: orange wash, blood flow up (PET); sparse purple dots, a selective block (model).`,anes:()=>`Schematic: orange wash, blood flow still up (PET); dense purple dots, block not selective (model).`}},extra:{next:`Next: how active the brain is (8), how its regions communicate (9–10).`,key:{none:[{swatch:`washOff`,text:`Blood Flow: Reference`,tip:`washRef07`},{swatch:`stipOff`,text:`No Receptor Block`,tip:`stipNone07`}],sub:[{swatch:`wash`,text:`Blood Flow Up (PET)`,tip:`wash07`},{swatch:`stipSparse`,text:`Selective Receptor Block (Model)`,tip:`stip07-sub`}],anes:[{swatch:`wash`,text:`Blood Flow Still Up (PET)`,tip:`wash07`},{swatch:`stipDense`,text:`Block No Longer Selective (Model)`,tip:`stip07-anes`}]}}},rw={step:{id:`act`,nav:`Ongoing Activity`,title:`Ongoing Activity: Faster Rhythms, More Varied Patterns`,body:`The resting alpha rhythm weakens while fast activity rises, and ongoing activity becomes more varied than waking, as with LSD and psilocybin. Under anesthesia fast activity persists in bursts between slow waves, and how varied the activity is changes over time rather than staying low.`,more:`Alpha (8–12 cycles per second), strongest over the back of the head with the eyes closed, fell most and gamma rose (Muthukumaraswamy 2015, MEG vs placebo, 19 men; Vlisides 2018, 15 volunteers, no placebo). Spontaneous signal diversity rose in every ketamine participant after accounting for rhythm changes, as with LSD and psilocybin in separate sessions (Schartner 2017); other EEG samples agree (Farnes 2020; Li and Mashour 2019). After an anesthetic bolus, slow waves alternated with fast bursts, then a steadier fast pattern followed (Akeju 2016); whole-scalp complexity alternated low and near waking, then near waking predominated (Li and Mashour 2019). Large slow waves were several times rarer than under propofol or xenon (Sarasso 2015, six per drug). In a circuit model, weaker NMDA signalling silenced steadily firing interneurons and produced gamma and, at high doses, slow interruptions (Adam 2024). Gamma power, signal diversity and the response to stimulation are three different measurements.`},panel:{tag:`Ongoing Activity · EEG and MEG · Traces Drawn, Not Recorded`,reference:{mode:`row`,text:`Eyes closed at rest: a waxing and waning alpha rhythm`,tip:`refAct`},columns:[{key:`sub`,head:`Subanesthetic`},{key:`anes`,head:`Anesthetic`}],rows:[{name:`Alpha`,tip:`rowAlpha`,cells:{sub:`Down, the largest change, posterior`,anes:`Low`}},{name:`Fast Activity`,how:`gamma`,tip:`rowGamma`,cells:{sub:`Up, broadly`,anes:`In bursts between slow waves; far fewer large slow waves than propofol or xenon`}},{name:`Signal Diversity`,how:`how varied the patterns are`,tip:`rowDiversity`,cells:{sub:`Up in every participant; LSD and psilocybin also up (Schartner 2017)`,anes:`Alternates low and near waking, then near waking (Li and Mashour 2019)`}}],note:`Gamma power, signal diversity and the response to stimulation are three different measurements.`,noteTip:`actMeasures`},tips:{"alpha08-none":{title:`Alpha Arcs: Strong`,body:`The resting rhythm at the back of the head, strongest with the eyes closed.`},"alpha08-sub":{title:`Alpha Arcs: Faint`,body:`Alpha fell most, ketamine’s largest change (Muthukumaraswamy 2015, MEG; Vlisides 2018, EEG).`},"alpha08-anes":{title:`Alpha Arcs: Faint`,body:`Alpha stays low under ketamine anesthesia (EEG; Vlisides 2017).`},texNone08:{title:`No Ticks: Reference Activity`,body:`Without ketamine the cortex is drawn plain: the waking reference for fast activity.`},texFast08:{title:`Fine Ticks: Fast Activity Up`,body:`Gamma rose broadly (MEG, EEG): ticks over the whole cortex, not a regional map.`},texBurst08:{title:`Banded Ticks: Bursts Between Slow Waves`,body:`Fast bursts alternate with slow waves (Akeju 2016): one whole-scalp EEG pattern, not a map.`},wash08:{title:`Orange Wash: Posterior Emphasis`,body:`Alpha fell and signal diversity rose most over posterior cortex; not a parcel-level finding.`},refAct:{title:`Reference: No Ketamine`,body:`Awake with the eyes closed, alpha waxes and wanes over the back of the head.`},eegRef:{title:`Schematic EEG, No Ketamine`,body:`A waxing and waning alpha rhythm: drawn, not recorded.`},actEegSub:{title:`Schematic EEG, Subanesthetic`,body:`Less alpha and more fast activity: drawn after the studies, not recorded.`},actEegAnes:{title:`Schematic EEG, Anesthetic`,body:`Fast bursts between slow waves, drawn as a short loop, not recorded.`},rowAlpha:{title:`Alpha (8–12 Cycles per Second)`,body:`Strongest over the back of the head with the eyes closed; ketamine’s largest change.`},rowGamma:{title:`Fast (Gamma) Activity`,body:`Fast rhythms rose at subanesthetic doses and persist in bursts under anesthesia.`},rowDiversity:{title:`Spontaneous Signal Diversity`,body:`How varied ongoing activity is: repeated patterns score low, varied patterns high.`},actMeasures:{title:`Three Measurements`,body:`Each is measured separately; none is a reading of the others, or of experience.`},drugStrip:{title:`Three Drugs Against Placebo`,body:`Each drug raised signal diversity against placebo, in separate sessions and doses (Schartner 2017).`}},parcels:{body:()=>`Neutral here: the arcs at the back of the head mark the resting alpha rhythm.`,byDose:{sub:()=>`Schematic: fine ticks, fast activity up everywhere; orange wash, alpha down most at the back.`,anes:()=>`Schematic: banded ticks, fast bursts between slow waves; one whole-scalp EEG measure, not a map.`}},extra:{drugs:{names:[`Ketamine`,`LSD`,`Psilocybin`],mark:`vs placebo`,caption:`Separate sessions and doses (Schartner 2017); directions only`,ref:`Reference: Placebo`},timeline:{chips:[`Low`,`Near Waking`]},alphaLabel:`Alpha`,key:{none:[{text:`Alpha Strong · Reference`,tip:`alpha08-none`},{swatch:`washOff`,text:`Fast Activity: Reference`,tip:`texNone08`}],sub:[{text:`Alpha Down, the Largest Change`,tip:`alpha08-sub`},{swatch:`texFast`,text:`Fast Activity Up, Broadly`,tip:`texFast08`},{swatch:`washPosterior`,text:`Posterior Emphasis (MEG)`,tip:`wash08`}],anes:[{text:`Alpha Low (EEG)`,tip:`alpha08-anes`},{swatch:`texBurst`,text:`Fast Bursts Between Slow Waves · Whole Scalp (EEG)`,t orrelation over time of fMRI signals: a relationship, not wiring, and its direction varies with region, timing and analysis. With ketamine, connectivity fell within the frontoparietal and sensorimotor networks and rose between the default mode network and four others; LSD and nitrous oxide showed the same broad tendency with different connections affected (Dai 2023). Thalamus coupling with sensory, motor and temporal cortex rose (Höflich 2015, 30 volunteers; Abram 2022, 18 men, not reduced by lamotrigine). Under ketamine unresponsiveness, default-mode front-to-back coordination and its usual opposition to other regions broke down, salience coordination was unevenly suppressed, and auditory, visual and sensorimotor networks changed little (Bonhomme 2016; eight of fourteen volunteers analysed). A larger randomised study found several default-mode connections increased (Fleming 2019, 53 participants): reconfiguration, not breakdown everywhere.`},panel:{tag:`Network Coordination · Resting-State fMRI`,reference:{mode:`row`,text:`A network is a set of regions whose activity rises and falls together; colour on the brain names each network`,tip:`refNet`},columns:[{key:`sub`,head:`Subanesthetic`,attr:`Dai 2023`,tip:`colDai`},{key:`anes`,head:`Anesthetic`,attr:`Separate study: Bonhomme 2016, eight volunteers`,tip:`colBonhomme`}],rows:[{name:`Within Networks`,tip:`rowWithin`,cells:{sub:`Less: frontoparietal, sensorimotor`,anes:`Default-mode coordination breaks down; salience unevenly weaker`}},{name:`Between Networks`,tip:`rowBetween`,cells:{sub:`More: default mode with four others; LSD, nitrous oxide: same tendency`,anes:`Auditory, visual, sensorimotor: coherent but isolated`}},{name:`Thalamus`,tip:`rowThal`,cells:{sub:`More with sensory and temporal cortex (fMRI)`,anes:`Not assessed here`}}],note:`A larger randomised study found several of these connections increased (Fleming 2019): reconfiguration, not breakdown everywhere.`,noteTip:`fleming`},tips:{thalRef09:{title:`Thalamus–Cortex Links: Reference`,body:`Schematic relationships between the thalamus and the cortex at the waking reference, not tract routes.`},thalSens09:{title:`Thalamus–Sensory Coupling: Stronger`,body:`The thalamus coupled more with sensory, motor and temporal cortex (Höflich 2015; Abram 2022).`},"thalRef09-sub":{title:`Thalamus–Frontal, Parietal Links`,body:`Drawn at reference: the rise reported was with sensory, motor and temporal cortex.`},thalNa09:{title:`Thalamus Links: Not Assessed`,body:`No study here measured thalamus coupling under anesthesia; schematic relationships, not tract routes.`},"fan09-none":{title:`Default Mode Links: Reference`,body:`Coordination between the default mode and four networks at the waking reference; schematic placement.`},...sw,"fan09-anes":{title:`Default Mode Links: Not Assessed`,body:`Bonhomme 2016 did not assess these pairs under anesthesia; schematic placement.`},...cw,"ring09-VIS":{title:`Visual Network: Coherent but Isolated`,body:lw},"ring09-SMN":{title:`Sensorimotor Network: Coherent but Isolated`,body:lw},"ring09-AUD":{title:`Auditory Cortex: Coherent but Isolated`,body:lw},netColour09:{title:`Network Colours`,body:`Each colour names one network (identity only), after a common seven-network scheme.`},"weak09-sub":{title:`Hatched: Less Coordination Within`,body:`Frontoparietal and sensorimotor regions followed one another less closely with ketamine (Dai 2023).`},"fan09-sub":{title:`Orange Lines: Stronger`,body:`Default mode with four networks (Dai 2023); thalamus with sensory cortex (Höflich 2015).`},"weak09-anes":{title:`Hatched: Coordination Broke Down`,body:`Default-mode front-to-back coordination broke down; salience unevenly weaker (Bonhomme 2016).`},island09:{title:`Rings: Coherent but Isolated`,body:`Auditory, visual and sensorimotor networks changed little at unresponsiveness (Bonhomme 2016).`},na09:{title:`Dotted Lines: Not Assessed`,body:`Neither the four network pairs nor the thalamus were assessed under anesthesia here.`},circleSub:{title:`Networks With Ketamine (Dai 2023)`,body:`Resting-state fMRI. Loops: coordination within a network; lines: between networks. Selected significant changes.`},circleAnes:{title:`Networks at Unresponsiveness (Bonhomme 2016)`,body:`A separate fMRI study at ketamine-induced unresponsiveness. Dotted grey: not assessed in that study.`},"netChords-sub":{title:`Between Networks: Stronger`,body:`The default mode network coordinated more with four other networks (Dai 2023).`},"netChords-anes":{title:`Between Networks: Not Assessed`,body:`Not assessed by Bonhomme 2016, which found the default mode’s usual opposition broke down.`},...ow,netLegend:{title:`Reading the Circles`,body:`Loops: coordination within a network. Lines: coordination between networks. Line style gives the direction, not the size.`},colDai:{title:`Dai 2023`,body:`Resting-state fMRI with ketamine; LSD and nitrous oxide showed the same broad tendency, with different connections affected.`},colBonhomme:{title:`Bonhomme 2016: A Separate Study`,body:`fMRI at ketamine-induced unresponsiveness, eight of fourteen volunteers analysed; a different protocol and network definitions from Dai 2023.`},refNet:{title:`Brain Networks`,body:`Sets of regions whose activity rises and falls together; the colours on the brain name each network only.`},rowWithin:{title:`Within Networks`,body:`How closely one network’s regions rise and fall together (fMRI). Under anesthesia, default-mode coordination and its usual opposition to other regions broke down.`},rowBetween:{title:`Between Networks`,body:`With ketamine the default mode moved more with the frontoparietal, salience, dorsal attention and language networks; LSD and nitrous oxide showed the same tendency (Dai 2023).`},rowThal:{title:`Thalamus and Cortex`,body:`Thalamus coupling with sensory, motor and temporal cortex rose with ketamine (fMRI; Höflich 2015, Abram 2022); not assessed under anesthesia here.`},fleming:{title:`A Larger Randomised Study`,body:`Fleming 2019, 53 participants: several default-mode connections increased, so this is reconfiguration, not breakdown everywhere.`}},parcels:{body:e=>`Shown here as part of the ${nd(e.net).toLowerCase()} network; colour identifies the network only.`,byDose:{sub:e=>uw[e.net],anes:e=>e.id===`stg`?`Ringed as auditory cortex: changed little at unresponsiveness (Bonhomme 2016).`:dw[e.net]}},extra:{caption:[[`Loops:`,`Within a Network`],[`Lines:`,`Between Networks`]],thalamus:`Thalamus`,matrixKey:`Connection-change matrix for the dose chosen on the slide, the same findings as the circle views: diagonal cells are within a network, the others between two networks; columns follow the rows’ order.`,key:{none:[{text:`Colour Names Each Network (Identity Only)`,tip:`netColour09`},{swatch:`link-reference`,text:`Lines: Waking Reference`,tip:`fan09-none`}],sub:[{swatch:`weak`,text:`Hatched: Less Within Frontoparietal, Sensorimotor (Dai 2023)`,tip:`weak09-sub`},{swatch:`link-stronger`,text:`Orange: More Between Networks and With the Thalamus`,tip:`fan09-sub`}],anes:[{swatch:`weak`,text:`Hatched: Default Mode, Salience Broke Down (Bonhomme 2016)`,tip:`weak09-anes`},{swatch:`island`,text:`Ringed: Sensory Networks Coherent but Isolated`,tip:`island09`},{swatch:`link-na`,text:`Dotted: Not Assessed Under Anesthesia`,tip:`na09`}]}}},pw=[`sfg`,`dlpfc`,`fef`,`ifg`,`ofc`],mw=[`ips`,`ipl`,`ang`],hw={step:{id:`hier`,nav:`Top-Down Control`,title:`Top-Down Control Weakens, Interpretation Falters`,body:`Frontal influence on parietal areas falls, while the thalamus, the relay that passes sensory signals to the cortex, couples more strongly with sensory areas. Signals arrive; what weakens is the ability to place them in an account of events. Under anesthesia frontal influence is lowest.`,more:`In a modelled MEG measure, frontal-to-parietal influence fell while the forward direction showed no significant change, and the change outlasted the subjective effects (Muthukumaraswamy 2015, 19 men). In an auditory task, responses to violations of higher-level regularities shrank; lower-level responses did not (Weber 2020, 19 volunteers, double-blind crossover). In a visual task, thalamus–cortex coupling rose at high frequencies while lower frequency and cortex–cortex coupling fell (Grent-'t-Jong 2018, 14 volunteers). At loss of responsiveness, frontal-to-parietal transfer was lowest, as under propofol and sevoflurane, so it cannot by itself explain ketamine’s dreams (Lee 2013, 30 patients). Modelled cortical dynamics grew steadily more damped as concentration rose (Dávila 2025, six men). Non-significant is not unchanged.`},panel:{tag:`Top-Down Influence · Two Different Measures`,reference:{mode:`row`,text:`Frontal areas shape how parietal and sensory areas interpret input; the two columns report two different measures`,tip:`refHier`},columns:[{key:`sub`,head:`Subanesthetic`,tip:`colMEG`},{key:`anes`,head:`Anesthetic`,tip:`colEEG`}],rows:[{name:`Frontal → Parietal Influence`,tip:`rowFP`,cells:{sub:`Down (modelled MEG)`,anes:`Lowest (EEG; shared with propofol and sevoflurane)`}},{name:`Thalamus → Sensory Cortex`,tip:`rowThalSens`,cells:{sub:`Stronger coupling (fMRI)`,anes:`Sensory areas coherent; whether signals reach experience is not established`}},{name:`Updating of Expectations`,tip:`rowUpdate`,cells:{sub:`Responses to higher-level regularities shrink`,anes:`Dynamics more damped as concentration rises`}},{name:`Report and Behaviour`,tip:`rowReport`,cells:{sub:`Responsive, perception altered`,anes:`Unresponsive`}}]},tips:{hierarchy:{title:`Processing Hierarchy (Schematic)`,body:`A teaching diagram, not a wiring map: signals pass up from the thalamus to frontal cortex (feedforward); higher areas feed back (feedback).`},hierSens:{title:`Sensory Cortex`,body:`The first cortical areas for sight, sound and touch, reporting what the senses deliver.`},hierAssoc:{title:`Association Cortex`,body:`Parietal and temporal areas that combine the senses and interpret them; the panel’s “parietal”.`},hierFront:{title:`Frontal Cortex`,body:`Holds goals and expectations; its feedback shapes how the areas below interpret their input.`},"hierFF-none":{title:`Feedforward`,body:`Signals passing up the hierarchy, from sensory toward frontal areas.`},"hierFF-sub":{title:`Feedforward: No Significant Change`,body:`In the modelled MEG measure the forward direction showed no significant change (Muthukumaraswamy 2015), which is not the same as unchanged.`},"hierFF-anes":{title:`Feedforward`,body:`Drawn at reference: the anesthetic findings here concern the feedback direction.`},"hierThalFF-none":{title:`Thalamus → Sensory Cortex`,body:`The relay passes sensory signals on to the cortex.`},"hierThalFF-sub":{title:`Thalamus → Sensory: Stronger Coupling`,body:`With ketamine the thalamus coupled more strongly with sensory cortex (fMRI: Höflich 2015, Abram 2022), and at high frequencies in a visual task (Grent-’t-Jong 2018).`},"hierThalFF-anes":{title:`Thalamus → Sensory Cortex`,body:`Drawn at reference: sensory areas stay coherent, and whether their signals reach experience is not established.`},"hierFB-none":{title:`Feedback`,body:`Higher areas shaping how the areas below interpret their input.`},"hierFB-sub":{title:`Feedback: Weaker (Modelled MEG)`,body:`Frontal-to-parietal influence fell in a model fitted to MEG (Muthukumaraswamy 2015); alpha-band EEG showed no clear change (Vlisides 2017). All three arrows thin as a schematic.`},"hierFB-anes":{title:`Feedback: Lowest (Alpha-Band EEG)`,body:`Lowest at loss of responsiveness in alpha-band EEG (Vlisides 2017), as under propofol and sevoflurane (Lee 2013). Dashed: lowest, not absent.`},"hierReport-none":{title:`Report and Behaviour`,body:`What a person says or does in response to the room.`},"hierReport-sub":{title:`Report and Behaviour`,body:`Still responsive, with perception altered.`},"hierReport-anes":{title:`Report and Behaviour: Unresponsive`,body:`No response to the room or to commands, so the output is greyed.`},"fpArrow-none":{title:`Frontal → Parietal Influence`,body:`Frontal areas send feedback that shapes how parietal areas interpret their input. Schematic placement.`},"fpArrow-sub":{title:`Frontal → Parietal: Down (Modelled MEG)`,body:`Fell in a model fitted to MEG (Muthukumaraswamy 2015); alpha-band EEG showed no clear change (Vlisides 2017).`},"fpArrow-anes":{title:`Frontal → Parietal: Lowest, Not Absent`,body:`Lowest at loss of responsiveness in alpha-band EEG (Vlisides 2017), as under propofol (Lee 2013).`},"input10-none":{title:`Input From the Room`,body:`Sight and sound reach sensory cortex: the waking reference (schematic).`},"input10-sub":{title:`Input: Weighted More, Not Louder`,body:`Signals still arrive while higher-level expectations weaken (Weber 2020); the balance shifts, schematic.`},"input10-anes":{title:`Input From the Room: Cut Off`,body:`Unresponsive: the room no longer drives report or behaviour; sensory areas stay coherent.`},room10:{title:`The Room`,body:`The surroundings the eyes and ears take in; drawn as a schematic.`},"sens10-sub":{title:`Sensory Areas: Stronger Thalamic Coupling`,body:`The thalamus coupled more with sensory cortex (fMRI: Höflich 2015, Abram 2022); schematic.`},ring10:{title:`Sensory Areas: Coherent but Isolated`,body:`Sensory networks changed little (Bonhomme 2016); whether signals reach experience is not established.`},pillMEG:{title:`Frontal → Parietal, Modelled MEG`,body:`A model fitted to MEG: frontal-to-parietal influence fell, while the forward direction showed no significant change.`},pillEEG:{title:`Frontal → Parietal, Alpha-Band EEG`,body:`Alpha-band directed connectivity was lowest during ketamine anesthesia (Vlisides 2017); frontal-to-parietal transfer was lowest under propofol and sevoflurane too (Lee 2013).`},colMEG:{title:`Subanesthetic: Modelled MEG`,body:`MEG against placebo in 19 men, read through a model of frontal and parietal activity (Muthukumaraswamy 2015).`},colEEG:{title:`Anesthetic: EEG`,body:`EEG directed connectivity at loss of responsiveness (Lee 2013, 30 patients; Vlisides 2017): a different measure from the MEG model.`},refHier:{title:`Top-Down Influence`,body:`Frontal areas shape how parietal and sensory areas interpret what arrives. The two columns use different measures, so compare directions, not sizes.`},rowFP:{title:`Frontal → Parietal Influence`,body:`Subanesthetic: a model fitted to MEG. Anesthetic: EEG directed connectivity, lowest under ketamine, propofol and sevoflurane alike.`},rowThalSens:{title:`Thalamus → Sensory Cortex`,body:`Coupling between the thalamus and sensory cortex rose with ketamine (fMRI: Höflich 2015, Abram 2022).`},rowUpdate:{title:`Updating of Expectations`,body:`Responses to broken higher-level regularities shrank, lower-level ones did not (Weber 2020); at rising concentrations, dynamics grew more damped (Dávila 2025).`},rowReport:{title:`Report and Behaviour`,body:`Whether people respond to the room and to commands: yes, with altered perception, then no.`}},parcels:{body:e=>pw.includes(e.id)?`Frontal cortex, tinted as where the frontal-to-parietal measure starts; the tint marks location only.`:mw.includes(e.id)?`Parietal cortex, tinted as where the frontal-to-parietal measure arrives; the tint marks location only.`:us.includes(e.id)?`Sensory cortex (touch, hearing, sight): neutral at the waking reference.`:`Neutral here: this slide’s measures are drawn in the diagram below and in the panel.`,byDose:{sub:e=>pw.includes(e.id)?`Frontal tint faded: frontal-to-parietal influence fell (modelled MEG, Muthukumaraswamy 2015).`:mw.includes(e.id)?`Parietal cortex, where the frontal-to-parietal measure arrives; the tint marks location only.`:us.includes(e.id)?`Warm: the thalamus coupled more with sensory cortex (fMRI: Höflich 2015, Abram 2022).`:`Neutral here: this slide’s measures are drawn in the diagram below and in the panel.`,anes:e=>pw.includes(e.id)?`Frontal tint grey: frontal-to-parietal influence lowest at unresponsiveness (EEG; Lee 2013).`:mw.includes(e.id)?`Parietal cortex, where the frontal-to-parietal measure arrives; the tint marks location only.`:us.includes(e.id)?`Warm, ringed: sensory areas stay coherent (Bonhomme 2016); reaching experience not established.`:`Neutral here: this slide’s measures are drawn in the diagram below and in the panel.`}},extra:{hierarchy:{title:`Processing Hierarchy · Schematic`,nodes:[[`Thalamus`],[`Sensory`,`Cortex`],[`Association`,`Cortex`],[`Frontal`,`Cortex`]],ff:`Feedforward →`,fb:`← Feedback`,fbMeasure:{none:``,sub:`modelled MEG`,anes:`alpha-band EEG`},report:[`Report /`,`Behaviour`],reportState:{none:`Responsive`,sub:`Responsive, altered`,anes:`Unresponsive`}},pill:{from:`Frontal`,to:`Parietal`,sub:`modelled MEG`,anes:`alpha-band EEG`},brain:{frontal:`Frontal`,parietal:`Parietal`},key:{none:[{text:`Frontal Influence: Reference`,tip:`fpArrow-none`},{swatch:`input-solid`,text:`Input From the Room: Reference`,tip:`input10-none`}],sub:[{text:`Frontal Influence Down (Modelled MEG)`,tip:`fpArrow-sub`},{swatch:`input-go`,text:`Input Weighted More (Not Louder)`,tip:`input10-sub`},{text:`Sensory Areas: Thalamus Coupling Up (fMRI)`,tip:`sens10-sub`}],anes:[{text:`Frontal Influence Lowest (EEG)`,tip:`fpArrow-anes`},{swatch:`input-cut`,text:`Room Cut Off: Unresponsive`,tip:`input10-anes`},{text:`Sensory Areas Coherent but Isolated`,tip:`ring10`}]}}};for(let e of[...pw,...mw])if(!fs[e])throw Error(`s10/text.ts: no region '${e}'`);var gw={step:{id:`self`,nav:`The Body Map`,title:`The Body Map and the Sense of Self`,body:`Of everything people report, the change in bodily experience is the largest: floating, disembodiment, being somewhere other than the body. Measures of body ownership loosen in the same direction. Under anesthesia these experiences appear around the transition and inside the dreams.`,more:`Disembodiment was the largest elevation above volunteers’ own lifetime ratings (Vlisides 2018, 15 volunteers, no placebo), and among the highest subscales in Farnes 2020. A rubber hand was adopted more readily and no longer required synchronised stroking (Morgan 2011, 15 volunteers). The right temporoparietal junction separated self- from other-produced affective touch less, tracking reduced interoceptive awareness (Kaldewaij 2024, 30 participants, placebo-controlled crossover). Intracranial recordings in ten epilepsy patients found a 3–4 Hz posteromedial rhythm during the altered body experience (Tian 2023), after a mouse rhythm that LSD did not produce (Vesuna 2020): a candidate correlate, not an explanation. Nothing here is measured during deep unresponsiveness.`},panel:{tag:`The Body and the Self`,reference:{mode:`row`,text:`The TPJ and posteromedial cortex combine touch, vision and balance into a body-centred self`,tip:`refSelf`},columns:[{key:`sub`,head:`Subanesthetic`},{key:`anes`,head:`Anesthetic`}],rows:[{name:`Reports`,tip:`rowReports`,cells:{sub:`Disembodiment, the largest change`,anes:`Extreme bodily and spatial changes at the transition; out-of-body reports inside the dreams`}},{name:`Body Ownership`,how:`rubber hand`,tip:`rowRubber`,cells:{sub:`Stronger, less timing-dependent`,anes:`Not measured`}},{name:`Right TPJ`,how:`fMRI`,tip:`rowTpj`,cells:{sub:`Separates self- from other-touch less`,anes:`Not measured`}},{name:`Posteromedial Cortex`,how:`intracranial`,tip:`rowPmc`,cells:{sub:`A slow 3–4 Hz rhythm accompanies it (candidate correlate)`,anes:`No time-resolved mapping during unresponsiveness`}}],note:`The posteromedial rhythm is a candidate correlate, not an explanation.`,noteTip:`notePmc`},tips:{tpj:{title:`Temporoparietal Junction (TPJ)`,body:`Where temporal and parietal lobes meet; it helps build the sense of one’s own body.`},tpjSub:{title:`Right TPJ With Ketamine`,body:`It separated self- from other-produced touch less (Kaldewaij 2024, placebo-controlled).`},pmc:{title:`Posteromedial Cortex`,body:`The precuneus and posterior cingulate cortex, on the brain’s inner surface toward the back.`},p
