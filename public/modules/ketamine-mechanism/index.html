x (PCI)`,body:`Scores how complex, not how large, the EEG response to a brief magnetic pulse is.`},rowExp:{title:`Reported Experience`,body:`Anesthetic dreams were reported afterwards, so they cannot be tied to a moment (Sarasso 2015).`},"ripple12-none":{title:`Pulse Response: Complex`,body:`Schematic: a complex, widespread response to a magnetic pulse (PCI).`},"ripple12-sub":{title:`Pulse Response: No Clear Change`,body:`Schematic: still complex and widespread; no clear increase detected (Farnes 2020).`},"ripple12-anes":{title:`Pulse Response: Near Waking`,body:`Schematic: still complex and widespread, near waking, though unresponsive (Sarasso 2015).`},"input12-none":{title:`Connected to the Room`,body:`Schematic: awake and responsive, the room’s sights and sounds organise experience.`},"input12-sub":{title:`The Room Shapes the Imagery`,body:`Schematic: responsive; the setting strongly shapes the dream-like imagery.`},"input12-anes":{title:`Cut Off From the Room`,body:`Schematic: the room no longer organises experience; unresponsive to command.`},room12:{title:`The Room`,body:`Schematic: the surroundings’ sights and sounds; arrows show whether they reach experience.`},burst12:{title:`Bursts Between Slow Waves`,body:`Schematic EEG under ketamine anesthesia: fast bursts between slow waves (Akeju 2016); not a map.`},fast12:{title:`Faster Activity`,body:`Schematic EEG: less alpha, more fast activity (Vlisides 2018); not a map.`},eeg12:{title:`Waking EEG (Reference)`,body:`Schematic: no texture; the waking EEG is the reference for the other doses.`}},parcels:{body:()=>`Neutral here: this slide compares measurements and reports, not regions.`,byDose:{sub:e=>e.view===`lateral`?`Schematic: less alpha, more fast activity (EEG, slide 8); not a regional map.`:`Neutral here: this slide compares measurements and reports, not regions.`,anes:e=>e.view===`lateral`?`Schematic: bursts of fast activity between slow waves (EEG); not a regional map.`:`Neutral here: this slide compares measurements and reports, not regions.`}},extra:{progression:{label:`Rising Concentration`,stages:[`Altered body`,`Floating, reality testing intact`,`Imagery indistinguishable from the room`,`Unresponsive`]},pci:{rows:{level:`Complexity`,dreams:`Dreams`},cols:[{who:`Waking`,level:`Reference`,tone:`ref`,drug:`none`,tip:`pciWaking`},{who:`Ketamine`,level:`Near waking`,tone:`same`,drug:`ket`,tip:`pciKet`,dreams:6},{who:`Propofol`,level:`Low`,tone:`less`,drug:`gaba`,tip:`pciProp`,dreams:0},{who:`Xenon`,level:`Low`,tone:`less`,drug:`other`,tip:`pciXenon`,dreams:0}],of:6,caption:`Sarasso 2015 · six volunteers per drug; in that study`},pulseLabel:[`Magnetic Pulse`,`Illustrative Site`],key:{none:[{swatch:`ripples`,text:`Pulse Response (PCI): Complex`,tip:`ripple12-none`},{swatch:`washOff`,text:`EEG: Waking Reference`,tip:`eeg12`},{swatch:`input-solid`,text:`The Room Organises Experience`,tip:`input12-none`}],sub:[{swatch:`ripples`,text:`Pulse Response (PCI): No Clear Change`,tip:`ripple12-sub`},{swatch:`texFast`,text:`Faster Activity (EEG)`,tip:`fast12`},{swatch:`input-go`,text:`The Room Shapes the Imagery`,tip:`input12-sub`}],anes:[{swatch:`ripples`,text:`Pulse Response (PCI): Near Waking`,tip:`ripple12-anes`},{swatch:`texBurst`,text:`Bursts Between Slow Waves (EEG)`,tip:`burst12`},{swatch:`input-cut`,text:`Cut Off From the Room`,tip:`input12-anes`}]}}},vw={step:{id:`two`,nav:`Ketamine and Propofol`,title:`Two Ways to Be Unresponsive`,body:`Propofol strengthens the brain’s inhibitory GABA system; ketamine blocks one excitatory receptor. Both end responsiveness, and both cut the frontal areas’ influence on the rest of the cortex. Then they part: propofol quiets the cortex, with no experience reported; ketamine leaves it active, and dreaming.`,more:`Ketamine, propofol and sevoflurane all reduced frontal-to-parietal transfer at loss of responsiveness, with different rhythms (Lee 2013). In one experiment, six volunteers per drug: the response to a magnetic pulse became local and simple under propofol and stereotyped under xenon (a non-GABAergic anesthetic) while ketamine’s stayed complex; large slow waves were several times more frequent under propofol and xenon; no experience was recalled after either in that study (Sarasso 2015). Propofol anesthesia roughly halves the brain’s glucose metabolism (Alkire 1995, PET); ketamine anesthesia raised blood flow by about a third with no change in whole-brain oxygen or glucose use (Långsjö 2005). Benzodiazepines act on the same GABA-A system as propofol and deepen that inhibition.`},panel:{tag:`Ketamine and Propofol Compared`,columns:[{key:`sub`,head:`Subanesthetic Ketamine`,accent:`var(--ket)`},{key:`anes`,head:`Anesthetic Ketamine`,accent:`var(--ket)`},{key:`gaba`,head:`Propofol Anesthesia`,accent:`var(--gaba)`}],rows:[{name:`Mechanism`,tip:`rowMech`,cells:{sub:`NMDA block, proposed interneuron preference`,anes:`NMDA block, broader`,gaba:`GABA-A inhibition strengthened`}},{name:`Frontal → Parietal`,tip:`rowFP13`,cls:`shared`,span:[`anes`,`gaba`],cells:{sub:`Down (modelled)`,anes:`Lowest in both`,gaba:`Lowest in both`}},{name:`Slow Waves`,tip:`rowSlow`,cells:{sub:`Reduced (delta down)`,anes:`Some, between fast bursts`,gaba:`Large and frequent`}},{name:`Response to a Magnetic Pulse`,how:`complexity`,tip:`rowPulse13`,cells:{sub:`No clear change`,anes:`Near waking`,gaba:`Low`}},{name:`Blood Flow and Metabolism`,tip:`rowFlowMet`,cells:{sub:`Flow up`,anes:`Flow up, metabolism little changed`,gaba:`Metabolism about halved`}},{name:`Experience`,tip:`rowExp13`,cells:{sub:`Responsive, altered`,anes:`Unresponsive; vivid dreams (six of six)`,gaba:`Unresponsive; none recalled (that study)`}}]},tips:{glyphKet:{title:`Ketamine Anesthesia: Active`,body:`Unresponsive, yet active: blood flow up (wash), a broad block (dots), fast bursts. Schematic.`},glyphProp:{title:`Propofol Anesthesia: Quiet`,body:`Large, frequent slow waves: the cortex is quieted (Sarasso 2015). Schematic.`},traceKet13:{title:`Schematic EEG: Ketamine Anesthesia`,body:`Fast activity in bursts between slow waves (Akeju 2016); drawn, not recorded.`},traceProp13:{title:`Schematic EEG: Propofol Anesthesia`,body:`Large slow waves with a small alpha ripple (Purdon 2015); drawn, not recorded.`},rowMech:{title:`Mechanism`,body:`Ketamine blocks NMDA receptors (interneurons first, in the proposed model); propofol strengthens GABA-A inhibition.`},rowFP13:{title:`Frontal → Parietal (Shared)`,body:`At loss of responsiveness, frontal-to-parietal transfer was lowest under both drugs (Lee 2013).`},rowSlow:{title:`Slow Waves`,body:`Large slow waves: several times more frequent under propofol and xenon than ketamine (Sarasso 2015).`},rowPulse13:{title:`Response to a Magnetic Pulse`,body:`Its complexity (PCI): Farnes 2020 at subanesthetic doses; Sarasso 2015 under anesthesia.`},rowFlowMet:{title:`Blood Flow and Metabolism`,body:`PET: ketamine raises blood flow (Långsjö 2003, 2005); propofol about halves glucose use (Alkire 1995).`},rowExp13:{title:`Experience`,body:`Reported afterwards: vivid dreams after ketamine, none recalled after propofol, in that study (Sarasso 2015).`},wash13:{title:`Orange Wash: Blood Flow Up`,body:`PET found blood flow up at both doses; a direction, not a map of activity.`},washRef13:{title:`No Wash: Blood Flow at Reference`,body:`Without ketamine, blood flow is the waking reference, so the cortex stays neutral.`},"stip13-sub":{title:`Purple Dots: A Selective Block`,body:`In the model, a selective block: interneurons’ NMDA receptors and those outside synapses.`},"stip13-anes":{title:`Purple Dots: Block No Longer Selective`,body:`In the model, the block spreads: excitatory neurons’ synaptic receptors are blocked too.`},stipNone13:{title:`No Dots: No Receptor Block`,body:`Without ketamine no NMDA receptors are blocked, so no dots are drawn.`},fpLink13:{title:`Frontal–Parietal Link: Broken`,body:`At loss of responsiveness, frontal-to-parietal transfer fell to its lowest, as under propofol (Lee 2013).`},"fpLink13-none":{title:`Frontal–Parietal Link: Reference`,body:`Schematic placement: frontal areas’ influence on parietal areas, at its waking reference.`},"fpLink13-sub":{title:`Frontal–Parietal Link: Weaker`,body:`Down in a modelled MEG measure (Muthukumaraswamy 2015); the placement is schematic.`}},parcels:{body:()=>`Neutral here: the comparison is drawn in the two glyphs below and in the panel.`,byDose:{sub:()=>`Schematic: blood flow up (PET); sparse dots, a selective block (model); frontal link weaker.`,anes:()=>`Schematic: blood flow still up (PET); dense dots, block not selective (model); frontal link broken.`}},extra:{glyphs:{ket:`Ketamine Anesthesia: Active`,prop:`Propofol Anesthesia: Quiet`,caption:`Schematic, after Sarasso 2015 and Purdon 2015`},key:{none:[{swatch:`washOff`,text:`Blood Flow: Reference`,tip:`washRef13`},{swatch:`stipOff`,text:`No Receptor Block`,tip:`stipNone13`},{swatch:`link-reference`,text:`Frontal → Parietal: Reference`,tip:`fpLink13-none`}],sub:[{swatch:`wash`,text:`Blood Flow Up (PET)`,tip:`wash13`},{swatch:`stipSparse`,text:`Selective Receptor Block (Model)`,tip:`stip13-sub`},{swatch:`link-weaker`,text:`Frontal → Parietal Down (Modelled MEG)`,tip:`fpLink13-sub`}],anes:[{swatch:`wash`,text:`Blood Flow Still Up (PET)`,tip:`wash13`},{swatch:`stipDense`,text:`Block No Longer Selective (Model)`,tip:`stip13-anes`},{swatch:`link-broken`,text:`Frontal → Parietal Lowest (EEG)`,tip:`fpLink13`}]}}},yw={step:{id:`set`,nav:`The Setting`,title:`The Setting Shapes the Experience`,body:`At similar doses the reports differ with the surroundings: distortions in a structured room; vivid voices and music in the unvarying noise of a scanner; complex imagery and sound–colour blending with the eyes closed or covered. Under anesthesia the room no longer shapes experience.`,more:`These are separate studies, not one experiment. Structured testing with the eyes open found perceptual distortions without formed hallucinations (Pomarol-Clotet 2006); a scanner case series described vivid auditory verbal and musical hallucinations at ordinary doses (Powers 2015); complex imagery was among the largest reported changes, and audiovisual synesthesia also rose, in a resting EEG session (Vlisides 2018; Farnes 2020). In a randomised trial, adding an eye mask, music and mindfulness prompts made the experience richer and more meaningful for many without changing the antidepressant effect (Kheirkhah 2025, 43 patients). Anesthetised volunteers’ dreams were unrelated to the room, and four of six hallucinated their surroundings on emergence, as connection returned (Sarasso 2015).`},panel:{tag:`The Setting · Separate Studies`,reference:{mode:`row`,text:`Ordinary perception is shaped by the surroundings`,tip:`refSet`},columns:[{key:`sub`,head:`Subanesthetic`},{key:`anes`,head:`Anesthetic`}],rows:[{name:`Structured Lab`,how:`eyes open`,tip:`rowLab`,cells:{sub:`Distortions, no formed hallucinations`,anes:`The dreams are not about the room`}},{name:`Unvarying Scanner Noise`,tip:`rowScanner`,cells:{sub:`Voices and music`,anes:`Dynamics more damped as concentration rises`}},{name:`Eyes Covered, Music`,tip:`rowCovered`,cells:{sub:`Complex imagery, sound–colour blending; a richer experience`,anes:`On emergence, hallucinations of the surroundings (four of six)`}},{name:`Why`,how:`slides 8–10`,tip:`rowWhy`,cells:{sub:`Less organising rhythm, a weaker top-down account, more varied ongoing activity`,anes:`The room no longer shapes the content`}}]},tips:{cardOpen:{title:`Structured Lab, Eyes Open`,body:`Structured testing with the eyes open: perceptual distortions without formed hallucinations (Pomarol-Clotet 2006).`},cardCovered:{title:`Eyes Covered, Music`,body:`Complex imagery with the eyes closed; a mask, music and prompts made the experience richer.`},settingDial:{title:`From the Surroundings to Inside`,body:`Where experience comes from as exposure rises: a schematic direction, with no numbers.`},setDialLeft:{title:`Shaped by the Surroundings`,body:`What is experienced follows the room: its sights, sounds and structure.`},setDialRight:{title:`Generated Inside`,body:`Experience arises within, as in dreams unrelated to the room (Sarasso 2015).`},refSet:{title:`Ordinary Perception`,body:`Without ketamine, what we perceive is anchored to the surroundings.`},rowLab:{title:`Structured Lab, Eyes Open`,body:`Eyes-open structured testing (Pomarol-Clotet 2006); anesthetic dreams unrelated to the room (Sarasso 2015).`},rowScanner:{title:`Unvarying Scanner Noise`,body:`Scanner case series: vivid voices and music (Powers 2015); damped dynamics from Dávila 2025.`},rowCovered:{title:`Eyes Covered, Music`,body:`Imagery with eyes closed (Vlisides 2018; Farnes 2020); richer with mask and music (Kheirkhah 2025).`},rowWhy:{title:`Why the Setting Matters`,body:`Proposed: slides 8–10’s changes open experience to the surroundings; anesthesia cuts the link.`},"input14-none":{title:`The Room Shapes Experience`,body:`Schematic: ordinary perception is anchored to the surroundings’ sights and sounds.`},"input14-sub":{title:`Strongly Setting-Dependent`,body:`Schematic: reports differ with the surroundings; the setting’s influence, not louder senses.`},"input14-anes":{title:`Cut Off From the Room`,body:`Schematic: the room no longer shapes experience; dreams are not about it (Sarasso 2015).`},room14:{title:`The Room`,body:`Schematic: the surroundings’ sights and sounds; arrows show how much they shape experience.`},wash14:{title:`Faint Posterior Wash`,body:`Schematic: less organising alpha rhythm, more varied activity, mostly posterior.`}},parcels:{body:()=>`Neutral here: this slide compares settings, not regions.`,byDose:{sub:()=>`Schematic: faint posterior wash, less alpha and more varied activity (slide 8); not a map.`}},extra:{dial:{left:`Shaped by the Surroundings`,right:`Generated Inside`,ticks:[`Lower Subanesthetic Exposure`,`Higher`,`Anesthesia`]},cards:{head:`Two Settings at Subanesthetic Doses · Separate Studies`,open:{title:`Structured Lab, Eyes Open`,lines:[`Distortions, no formed hallucinations`]},covered:{title:`Eyes Covered, Music`,lines:[`Complex imagery, sound–colour blending;`,`a richer experience`]}},key:{none:[{swatch:`input-solid`,text:`The Room Shapes Experience`,tip:`input14-none`}],sub:[{swatch:`input-go`,text:`Setting Shapes Experience Strongly`,tip:`input14-sub`},{swatch:`washPosterior`,text:`Less Alpha, More Varied Activity (EEG, MEG)`,tip:`wash14`}],anes:[{swatch:`input-cut`,text:`The Room No Longer Shapes Experience`,tip:`input14-anes`}]}}},bw={step:{id:`answer`,nav:`Summary`,title:`Summary`,body:`Across the dose range the brain stays active and its response to stimulation stays complex, while the room’s hold on experience falls away and the body map loosens. Dreaming runs through: a waking dream the setting can shape, then a dream cut off from it.`,more:`“In this circuit model” marks Abdallah 2016’s GO and STOP account of slides 3–5, mainly from rodent work; the preference for interneurons is proposed. Plasticity means changes in synaptic strength or number (Li 2010; Autry 2011, rodents); clinical improvement can begin within two hours and persist for days (Zarate 2006); these studies do not establish BDNF outcomes at anesthetic doses. Treating the response to a magnetic pulse as the capacity for experience is one interpretation, not an established rule (Farnes 2020). The distinction between responsiveness, connection to the surroundings and experience follows Sanders 2012. Neurotoxicity evidence comes from long-term heavy use, far beyond clinical exposure (Diep 2025, §6.3).`},table:{tag:`Three Measures Across Dose`,cols:[{key:`ref`,head:`No Ketamine`,tip:`sumColRef`},{key:`sub`,head:`Subanesthetic`,tip:`sumColSub`},{key:`anes`,head:`Anesthetic`,tip:`sumColAnes`},{key:`gaba`,head:`Propofol`,tip:`sumColProp`,muted:!0}],rows:[{name:`Response to a Magnetic Pulse`,how:`complexity (PCI)`,tip:`sumPulse`,cells:{ref:{text:`Waking`,tone:`ref`,tip:`sumPulseRef`},sub:{text:`No clear change`,tone:`same`,tip:`sumPulseSub`},anes:{text:`Near waking`,tone:`same`,tip:`sumPulseAnes`},gaba:{text:`Low`,tone:`less`,tip:`sumPulseProp`}}},{name:`How Much the Surroundings Shape Experience`,tip:`sumSurround`,cells:{ref:{text:`Fully`,tone:`ref`,tip:`sumSurRef`},sub:{text:`Strongly`,note:`setting-dependent`,tone:`same`,tip:`sumSurSub`},anes:{text:`Not at all`,note:`dreams not about the room`,tone:`less`,tip:`sumSurAnes`},gaba:{text:`None recalled`,tone:`na`,tip:`sumSurProp`}}},{name:`Responsiveness`,tip:`sumResp`,cells:{ref:{text:`Full`,tone:`ref`,tip:`sumRespRef`},sub:{text:`Preserved`,tone:`same`,tip:`sumRespSub`},anes:{text:`Lost`,tone:`less`,tip:`sumRespAnes`},gaba:{text:`Lost`,tone:`less`,tip:`sumRespProp`}}}],note:`Categories, not measured amounts. Propofol: the same experiment’s comparison (Sarasso 2015).`},tips:{sumColRef:{title:`No Ketamine`,body:`Awake without ketamine: the reference for each measure.`},sumColSub:{title:`Subanesthetic Ketamine`,body:`Responsive, with altered experience; from the subanesthetic studies on the brain slides.`},sumColAnes:{title:`Anesthetic Ketamine`,body:`Unresponsive; from Sarasso 2015 and the anesthetic studies on the brain slides.`},sumColProp:{title:`Propofol (Reference)`,body:`A GABA-A anesthetic from the same experiment, shown for comparison (Sarasso 2015).`},sumPulse:{title:`Response to a Magnetic Pulse (PCI)`,body:`PCI scores its complexity; reading that as capacity for experience is one interpretation (Farnes 2020).`},sumSurround:{title:`How Much the Surroundings Shape Experience`,body:`Whether what is experienced follows the room; this differs from responsiveness (Sanders 2012).`},sumResp:{title:`Responsiveness`,body:`Whether people respond to commands; losing it does not mean losing experience (Sanders 2012).`},sumPulseRef:{title:`Waking`,body:`The reference: the complexity of the response in the awake brain.`},sumPulseSub:{title:`No Clear Change`,body:`No clear increase was detected at subanesthetic doses (Farnes 2020, ten volunteers).`},sumPulseAnes:{title:`Near Waking`,body:`Near waking in six unresponsive volunteers (Sarasso 2015).`},sumPulseProp:{title:`Low`,body:`The response became local and simple under propofol (Sarasso 2015).`},sumSurRef:{title:`Fully`,body:`Awake, what is experienced follows the surroundings.`},sumSurSub:{title:`Strongly, Setting-Dependent`,body:`Reports differ between a structured room, a scanner, and covered eyes with music.`},sumSurAnes:{title:`Not at All`,body:`The dreams reported afterwards were unrelated to the room (Sarasso 2015).`},sumSurProp:{title:`None Recalled`,body:`No experience was recalled after propofol in that study (Sarasso 2015).`},sumRespRef:{title:`Full`,body:`Awake and responsive.`},sumRespSub:{title:`Preserved`,body:`People keep responding; reality testing is intact at lower concentrations (Dávila 2025).`},sumRespAnes:{title:`Lost`,body:`Unresponsive to command, yet vivid dreams were reported afterwards (Sarasso 2015).`},sumRespProp:{title:`Lost`,body:`Unresponsive under propofol anesthesia (Sarasso 2015).`},riskPlast:{title:`Plasticity`,body:`Changes in synaptic strength or number, shown mainly in rodents (Li 2010; Autry 2011).`},riskTox:{title:`Neurotoxicity`,body:`The evidence comes from long-term heavy use, far beyond clinical exposure (Diep 2025, §6.3).`}},cards:{brainHead:`Across the Brain`,circuitHead:`In This Circuit Model`,sub:{tag:`Subanesthetic Dosages`,brain:`Alpha falls and ongoing activity becomes more varied. Networks coordinate less within and more between. Frontal influence falls, and the body map loosens. People stay responsive, with altered experience.`,circuit:`A proposed preferential block: more glutamate is released, and more BDNF is made.`},anes:{tag:`Anesthetic Dosages`,brain:`Fast bursts between slow waves; complexity alternates, then stays near waking. Long-range coordination fails. <b>People are unresponsive, yet vivid dreams are reported.</b>`,circuit:`A broader block: the glutamate surge stops (in rats). These studies do not establish BDNF outcomes at this dose.`},riskTag:`Plasticity and Risk`,plasticity:`<span class="cplast">Plasticity</span> findings are mainly preclinical.`,toxicity:`<span class="ctox">Neurotoxicity</span> concerns depend on exposure and context; heavy-use findings do not establish harm from one clinical treatment.`},bands:{a:`Analgesia`,b:`Psychedelic Effects`,c:`Anesthesia`,lower:`Lower Dose`,higher:`Higher Dose`}};function xw(e,...t){let n={};for(let r of t)for(let[t,i]of Object.entries(r)){if(t in n)throw Error(`content18.ts (${e}): tooltip key '${t}' is defined twice`);n[t]=i}return n}var Sw=xw(`V15_TIPS`,nw.tips,rw.tips,fw.tips,hw.tips,gw.tips,_w.tips,vw.tips,yw.tips,bw.tips),Cw={VIS:`Regions for sight that rise and fall together; the ring marks their coordination.`,SMN:`Regions for movement and touch that rise and fall together; the ring marks their coordination.`,DAN:`Regions that direct attention outward, rising and falling together; the ring marks their coordination.`,SAL:`Regions that flag what matters now, rising and falling together; the ring marks their coordination.`,LANG:`Regions for language that rise and fall together; the ring marks their coordination.`,FPN:`Regions for control and working memory, rising and falling together; the ring marks their coordination.`,DMN:`Regions most active at rest and in inward thought; the ring marks their coordination.`},ww={lobeFrontal:{title:`Frontal Lobe`,body:`Planning, decisions and movement; its front part is the prefrontal cortex.`},lobeParietal:{title:`Parietal Lobe`,body:`Touch, body position and space; it lies behind the central sulcus.`},lobeTemporal:{title:`Temporal Lobe`,body:`Hearing, language and memory; it lies below the lateral (Sylvian) fissure.`},lobeOccipital:{title:`Occipital Lobe`,body:`Vision, at the back of the brain.`},prefrontal18:{title:`Prefrontal Cortex`,body:`Where the rat glutamate was measured; the network of slides 2–6 is placed here.`},site18:{title:`Release Site (Schematic)`,body:`Glutamate released at synapses; the sites are fixed, only how often they flash changes.`},impulse18:{title:`Impulse (Schematic)`,body:`An impulse along an axon at one speed; only how often impulses run changes.`},thalDeep18:{title:`Thalamus (Deep)`,body:`A deep relay for sensory signals, dashed: a side view sees it through the cortex.`},pmcDeep18:{title:`Posteromedial Cortex (Inner Surface)`,body:`Precuneus and posterior cingulate, on the inner surface, drawn through the side view.`},"sens18-none":{title:`Sensory Areas`,body:`Touch, hearing and sight: the first cortical areas for what the senses deliver.`},"sens18-island":{title:`Sensory Areas: Coherent but Isolated`,body:`Sensory networks changed little under anesthesia (Bonhomme 2016); whether signals reach experience is unknown.`},...Object.fromEntries(ed.map(e=>[`netc-none-${e.id}`,{title:`${e.name} Network: Waking Reference`,body:Cw[e.id]}])),"netChords-none":{title:`Between Networks: Waking Reference`,body:`Lines between networks at the waking reference; line style gives direction, not size.`},"circle18-none":{title:`Networks at Rest`,body:`The waking reference: loops for coordination within a network, lines between networks.`},netMatrix18:{title:`Connection-Change Matrix`,body:`Each cell compares two networks at the chosen dose; the diagonal is within one network.`},"maps18-none":{title:`No Ketamine: Nothing to Map`,body:`The map shows change from placebo; without the drug there is no change to colour.`},"maps18-sub":{title:`Signal Diversity (Schematic Gradient)`,body:`Schartner 2017’s MEG map: broadly up, most at the back; a group statistic, not amounts.`},"maps18-anes":{title:`Anesthetic Dose: Kept Off the Map`,body:`Anesthetic complexity is one whole-scalp EEG measure (Li and Mashour 2019), not a regional map.`},view18Lateral:{title:`Lateral View`,body:`The outer surface of one hemisphere, seen from the side.`},view18Medial:{title:`Medial View`,body:`The inner surface, facing the other hemisphere; the grey cut is not cortex.`},cbar18:{title:`Colour Scale (Schematic)`,body:`A schematic gradient after Schartner 2017: a group statistic, not measured amounts.`},cxScale18:{title:`Schematic Change in Signal Diversity`,body:`A gradient after Schartner 2017’s group statistic: directions, not measured amounts.`}};function Tw(e,t){let n=tw[e];return[...new Set((t===`act`?[`actRhythm`,`actCx`]:[t]).flatMap(e=>n.numbersOf(e)))].sort((e,t)=>e-t)}var Ew=e=>e.length===1?`slide ${e[0]}`:`slides ${e.slice(0,-1).join(`, `)} and ${e[e.length-1]}`;function Dw(e){let t=tw[e],n=((...t)=>{let n=[...new Set(t.flatMap(t=>Tw(e,t)))].sort((e,t)=>e-t);if(!n.length)throw Error(`content18.ts: variant ${e} has no slide for ${t.join(`, `)}`);return Ew(n)});return n.seq=()=>`slide ${t.SEQ_SLIDE+1}`,n.brain=()=>`slides ${t.brainRange[0]}–${t.brainRange[1]}`,n.v=e,n}var Ow=[{who:`Abdallah CG, Adams TG, Kelmendi B, Esterlis I, Sanacora G, Krystal JH.`,what:`Ketamine’s mechanism of action: a path to rapid-acting antidepressants.`,where:`Depress Anxiety 2016;33(8):689–97.`,why:`GO/STOP pathways, figure numbering, BDNF convergence and dose-dependent prefrontal glutamate effects (slides 3–5, and wherever a later slide names the circuit model). The A-1…A-8 and B-1…B-4 labels on this page are its step numbering; the extrasynaptic placement of the eEF2 kinase route is its proposal.`},{who:`Autry AE, Adachi M, Nosyreva E, et al.`,what:`NMDA receptor blockade at rest triggers rapid behavioural antidepressant responses.`,where:`Nature 2011;475:91–95.`,why:e=>`eEF2 kinase, eEF2 phosphorylation and de-suppression of BDNF translation at rest (slides 3–5); BDNF and synapse growth in rodents (${e(`cham`)} and the summary).`,caveat:`Mainly preclinical (mouse).`},{who:`Li N, Lee B, Liu R-J, et al.`,what:`mTOR-dependent synapse formation underlies the rapid antidepressant effects of NMDA antagonists.`,where:`Science 2010;329:959–64.`,why:e=>`mTORC1-dependent synaptogenesis and spine density (slide 4; ${e(`cham`)} and the summary).`,caveat:`Mainly preclinical (rat).`},{who:`Moghaddam B, Adams B, Verma A, Daly D.`,what:`Activation of glutamatergic neurotransmission by ketamine.`,where:`J Neurosci 1997;17:2921–27.`,why:e=>`The glutamate surge at subanesthetic dose and its reversal at higher doses; the population measurement the slide-6 network view stands for; prefrontal extracellular glutamate rising at lower doses and falling at a high anesthetic dose (${e(`whole`)}; the comparison table on ${e(`cham`)}).`,caveat:`Rat microdialysis.`},{who:`Homayoun H, Moghaddam B.`,what:`NMDA receptor hypofunction produces opposite effects on prefrontal cortex interneurons and pyramidal neurons.`,where:`J Neurosci 2007;27:11496–500.`,why:`Interneurons suppressed first, pyramidal disinhibition (A-1, A-2; slides 2 and 4 and wherever the circuit model is named), shown with MK-801 rather than ketamine.`,caveat:`Mainly preclinical (rat).`},{who:`Maeng S, Zarate CA Jr, Du J, et al.`,what:`Cellular mechanisms underlying the antidepressant effects of ketamine: role of AMPA receptors.`,where:`Biol Psychiatry 2008;63:349–52.`,why:`AMPA throughput requirement (A-3, A-8; slide 4).`,caveat:`Mainly preclinical (mouse).`},{who:`Hardingham GE, Bading H.`,what:`Synaptic versus extrasynaptic NMDA receptor signalling.`,where:`Nat Rev Neurosci 2010;11:682–96.`,why:`Synaptic vs extrasynaptic NMDAR signalling, their subunit bias, and the tonic ambient glutamate that drives the extrasynaptic pool (slides 3–5).`},{who:`Miller OH, Yang L, Wang C-C, et al.`,what:`GluN2B-containing NMDA receptors regulate depression-like behavior and are critical for the rapid antidepressant actions of ketamine.`,where:`eLife 2014;3:e03581.`,why:`Pyramidal GluN2B deletion mimics ketamine’s antidepressant and synaptic effects (slide 4).`,caveat:`Mainly preclinical (mouse).`},{who:`Kotermanski SE, Johnson JW.`,what:`J Neurosci 2009;29(9):2774–79 — subunit-dependent potency under 1 mM Mg²⁺; Vestring S, et al. Nat Commun 2025;16:10613 — GluN2D in PV⁺/SOM⁺ interneurons (mouse); Zorumski CF, Izumi Y, Mennerick S. J Neurosci 2016;36:11158–64 — trapping open-channel block.`,where:``,why:`The proposed contributors to preferential interneuron sensitivity named at slide 4: receptor subunits (GluN2C/2D), their expression on fast-spiking PV⁺ interneurons, and use-dependent channel block.`,caveat:`Mainly preclinical.`},{who:e=>`Human glutamate response (slide 1 and ${e(`whole`)}: findings vary):`,what:`Taylor MJ, et al. J Psychopharmacol 2012 (no change in Glx); Stone JM, et al. Mol Psychiatry 2012 and Rowland LM, et al. Am J Psychiatry 2005 (increases on different measures); Abdallah CG, et al. Neuropsychopharmacology 2018 (+13% ¹³C glutamine enrichment).`,where:``,why:``},{who:`Zarate CA Jr, Singh JB, Carlson PJ, et al.`,what:`A randomized trial of an N-methyl-D-aspartate antagonist in treatment-resistant major depression.`,where:`Arch Gen Psychiatry 2006;63:856–64.`,why:`Clinical time course, where the summary cites it: improvement was measurable at the 110-minute assessment and persisted for days; the drug and its metabolites are still present in that window.`},{who:`Diep D, de la Salle S, Thibault Lévesque J, Lifshitz M, Garel N, Greenway KT.`,what:`The ketamine chameleon: history, pharmacology, and the contested value of experience.`,where:`Expert Rev Clin Pharmacol 2025;18(3):109–129. doi:10.1080/17512433.2025.2459377.`,why:e=>`The article the summary summarises (the biomedical and psychedelic frameworks, how “dissociation” became the dominant label, and the recommendations that follow); Figure 2, the scaffold for ${e.brain()} (primary studies govern where it compresses them: blood flow, complexity, neurotoxicity); the overlapping dose ranges (§6.5) at slide 1 and the summary; the dose-graded reading of Go/Stop (§6.2) at slide 5; the note that anesthesia involves more (§6.4, slide 5’s details); neurotoxicity and its exposure context (§6.3, ${e(`cham`)} and the summary).`},{who:`Abdallah CG, De Feyter HM, Averill LA, et al.`,what:`The effects of ketamine on prefrontal glutamate neurotransmission in healthy and depressed subjects.`,where:`Neuropsychopharmacology 2018;43(10):2154–2160. doi:10.1038/s41386-018-0136-3.`,why:e=>`Increased glutamate–glutamine cycling at a subanesthetic dose, measured in medial prefrontal cortex; no anesthetic dose studied (the Extra Details of ${e(`whole`)} only).`,caveat:`Human ¹³C spectroscopy.`},{who:`Långsjö JW, Kaisti KK, Aalto S, et al.`,what:`Effects of subanesthetic doses of ketamine on regional cerebral blood flow, oxygen consumption, and blood volume in humans.`,where:`Anesthesiology 2003;99(3):614–23.`,why:e=>`Higher blood flow at subanesthetic doses without a matching rise in oxygen consumption (${e(`whole`)}; the blood-flow comparison on ${e(`two`)}).`,caveat:`Human PET.`},{who:`Långsjö JW, Maksimow A, Salmi E, et al.`,what:`S-ketamine anesthesia increases cerebral blood flow in excess of the metabolic needs in humans.`,where:`Anesthesiology 2005;103(2):258–268.`,why:e=>`Under S-ketamine anesthesia, in eight men, blood flow rose beyond what the brain’s metabolism requires (${e(`whole`,`two`)}).`,caveat:`Human PET.`},{who:`Adam E, Kowalski M, Akeju O, Miller EK, Brown EN, McCarthy MM, Kopell N.`,what:`Ketamine can produce oscillatory dynamics by engaging mechanisms dependent on the kinetics of NMDA receptors.`,where:`Proc Natl Acad Sci U S A 2024;121(22):e2402732121. doi:10.1073/pnas.2402732121.`,why:e=>`A model bridge from circuit to rhythm (the Extra Details of ${e(`actRhythm`)}): weaker NMDA-receptor signalling silenced steadily firing interneurons, disinhibiting the circuit without preferentially targeting inhibitory neurons; the remaining excitation and inhibition produced gamma rhythms and, at high doses, slow interruptions.`,caveat:`A biophysical model, compared with human EEG and monkey recordings.`},{who:`Akeju O, Song AH, Hamilos AE, et al.`,what:`Electroencephalogram signatures of ketamine anesthesia-induced unconsciousness.`,where:`Clin Neurophysiol 2016;127(6):2414–2422.`,why:e=>`The gamma-burst pattern of ketamine anesthesia, slow delta waves alternating with fast gamma activity (the anesthetic rhythms on ${e(`actRhythm`)}; the anesthetic-ketamine column on ${e(`two`)}; the summary).`,caveat:`Human EEG.`},{who:`Li D, Mashour GA.`,what:`Cortical dynamics during psychedelic and anesthetized states induced by ketamine.`,where:`NeuroImage 2019;196:32–40. doi:10.1016/j.neuroimage.2019.03.076.`,why:e=>`The eyes-closed baseline with posterior alpha; less alpha, more fast activity and higher spontaneous complexity at a subanesthetic dose; after an anesthetic dose, whole-scalp EEG complexity, after accounting for differences in rhythms, alternated between low (slow-wave) and near-waking (burst) states, and near-waking states predominated later while volunteers were still unresponsive (${e(`act`)}: its electrical-activity row and the anesthetic timeline; the comparison table on ${e(`cham`)}).`,caveat:`Human high-density EEG.`},{who:`Vlisides PE, Bel-Bahar T, Lee U, Li D, Kim H, Janke E, Tarnal V, Pichurko AB, McKinney AM, Kunkler BS, Picton P, Mashour GA.`,what:`Neurophysiologic correlates of ketamine sedation and anesthesia: a high-density electroencephalography study in healthy volunteers.`,where:`Anesthesiology 2017;127(1):58–69. doi:10.1097/ALN.0000000000001671.`,why:e=>`Alpha power fell gradually with subanesthetic ketamine and stayed low under anesthesia (${e(`actRhythm`)}); frontal-to-parietal directed connectivity in the alpha band was relatively unchanged at subanesthetic doses and lowest during ketamine anesthesia (${e(`hier`)}).`,caveat:`Human high-density EEG.`},{who:`Lee U, Ku S, Noh G, Baek S, Choi B, Mashour GA.`,what:`Disruption of frontal–parietal communication by ketamine, propofol, and sevoflurane.`,where:`Anesthesiology 2013;118(6):1264–75.`,why:e=>`In 30 patients, frontal-to-parietal transfer was lowest at loss of responsiveness under ketamine, as under propofol and sevoflurane, with different rhythms (${e(`hier`,`two`)}).`,caveat:`Human EEG.`},{who:`Dai R, Larkin TE, Huang Z, et al.`,what:`Classical and non-classical psychedelic drugs induce common network changes in human cortex.`,where:`NeuroImage 2023;273:120097.`,why:e=>`With ketamine, less coordination within the frontoparietal and sensorimotor networks and more between the default mode network and the frontoparietal, salience, language and dorsal attention networks; LSD and nitrous oxide showed the same broad tendency, with different connections affected (${e(`net`)}; the LSD comparison on ${e(`cham`)}; the summary).`,caveat:`Human fMRI.`},{who:`Bonhomme V, Vanhaudenhuyse A, Demertzi A, et al.`,what:`Resting-state network-specific breakdown of functional connectivity during ketamine alteration of consciousness in volunteers.`,where:`Anesthesiology 2016;125(5):873–88.`,why:e=>`Under ketamine unresponsiveness, default-mode connectivity and its anticorrelation broke down, salience connectivity was unevenly suppressed, and executive-control, auditory, sensorimotor and visual networks changed little; dorsal attention and language networks were not analysed (${e(`net`,`two`)}).`,caveat:`Human fMRI; eight of fourteen volunteers analysed.`},{who:`Schartner MM, Carhart-Harris RL, Barrett AB, Seth AK, Muthukumaraswamy SD.`,what:`Increased spontaneous MEG signal diversity for psychoactive doses of ketamine, LSD and psilocybin.`,where:`Sci Rep 2017;7:46421.`,why:e=>`Spontaneous signal diversity rose with ketamine, as with LSD and psilocybin, each against placebo in separate sessions (${e(`actCx`,`cham`)} and the summary).`,caveat:`Human MEG.`},{who:`Farnes N, Juel BE, Nilsen AS, Romundstad LG, Storm JF.`,what:`Increased signal diversity/complexity of spontaneous EEG, but not evoked EEG responses, in ketamine-induced psychedelic state in humans.`,where:`PLoS One 2020;15(11):e0242056. doi:10.1371/journal.pone.0242056.`,why:e=>`In ten volunteers at subanesthetic doses, with the eyes closed: complex imagery and sound–colour blending (${e(`set`)}); spontaneous EEG diversity increased while the complexity of the response to magnetic stimulation (PCI) showed no significant increase, and reading PCI as the capacity for experience is its interpretation (where cited).`,caveat:`Human EEG with TMS.`},{who:`Sarasso S, Boly M, Napolitani M, Gosseries O, Charland-Verville V, Casarotto S, Rosanova M, Casali AG, Brichant J-F, Boveroux P, Rex S, Tononi G, Laureys S, Massimini M.`,what:`Consciousness and complexity during unresponsiveness induced by propofol, xenon, and ketamine.`,where:`Curr Biol 2015;25(23):3099–3105. doi:10.1016/j.cub.2015.10.014.`,why:e=>`Under ketamine anesthesia, six unresponsive volunteers had PCI comparable to waking while it fell with propofol and xenon; all six afterwards reported vivid dreams unrelated to the room, recalled on waking and so not tied to any moment, while none of the twelve given propofol or xenon recalled any experience (${e(`dream`,`two`)}); large slow waves were several times rarer than under propofol or xenon (where cited).`,caveat:`Human EEG with TMS; six volunteers per drug, retrospective reports.`},{who:`Muthukumaraswamy SD, Shaw AD, Jackson LE, Hall J, Moran R, Saxena N.`,what:`Evidence that subanesthetic doses of ketamine cause sustained disruptions of NMDA and AMPA-mediated frontoparietal connectivity in humans.`,where:`J Neurosci 2015;35(33):11694–706.`,why:e=>`MEG against placebo in 19 men: alpha fell most and gamma rose (${e(`actRhythm`)}); in a modelled measure, frontal-to-parietal influence fell while the forward direction showed no significant change, and the change outlasted the subjective effects (${e(`hier`)}; the comparison table on ${e(`cham`)}); posterior delta fell too (where a slow-wave comparison cites it).`,caveat:`Human MEG with a model of connectivity.`},{who:`Vlisides PE, et al.`,what:`Subanaesthetic ketamine and altered states of consciousness in humans.`,where:`Br J Anaesth 2018;121(1):249–59.`,why:e=>`In 15 volunteers without placebo: alpha fell and gamma rose (${e(`actRhythm`)}); complex imagery with the eyes closed was among the largest reported changes (${e(`set`)}); disembodiment was the largest elevation above their own lifetime ratings (${e(`cham`)}; elsewhere where cited).`,caveat:`Citation to be re-checked against the paper, including whether the EEG was recorded with the eyes closed.`},{who:`Höflich A, Hahn A, Küblböck M, et al.`,what:`Ketamine-induced modulation of the thalamo-cortical network in healthy volunteers as a model for schizophrenia.`,where:`Int J Neuropsychopharmacol 2015;18(9):pyv040.`,why:e=>`In 30 volunteers, thalamus coupling with sensory, motor and temporal cortex rose with ketamine (${e(`net`,`cham`)}).`,caveat:`Human fMRI. Citation to be re-checked against the paper.`},{who:`Abram SV, Roach BJ, Fryer SL, et al.`,what:`Validation of ketamine as a pharmacological model of thalamic dysconnectivity across the illness course of schizophrenia.`,where:`Mol Psychiatry 2022; doi:10.1038/s41380-022-01502-0.`,why:e=>`In 18 men, thalamus coupling with sensory cortex rose with ketamine, and lamotrigine did not reduce it (${e(`net`)}).`,caveat:`Human fMRI.`},{who:`Fleming LM, Javitt DC, Carter CS, et al.`,what:`A multicenter study of ketamine effects on functional connectivity: large scale network relationships, hubs and symptom mechanisms.`,where:`NeuroImage Clin 2019;22:101739.`,why:e=>`A larger randomised study (53 participants): several default-mode connections increased, so the network change is a reconfiguration, not breakdown everywhere (${e(`net`)}).`,caveat:`Human fMRI. Citation to be re-checked against the paper.`},{who:`Weber LA, Diaconescu AO, Mathys C, et al.`,what:`Ketamine affects prediction errors about statistical regularities: a computational single-trial analysis of the mismatch negativity.`,where:`J Neurosci 2020;40(29):5658–68.`,why:e=>`In an auditory task (19 volunteers, double-blind crossover), responses to violations of higher-level regularities shrank with ketamine; lower-level responses did not: sensory input weighted more, not louder (${e(`hier`)}; the sensory-input row on ${e(`cham`)}).`,caveat:`Human EEG. Citation to be re-checked against the paper.`},{who:`Dávila DG, McKinstry-Wu A, Kelz MB, Proekt A.`,what:`The administration of ketamine is associated with dose-dependent stabilization of cortical dynamics in humans.`,where:`J Neurosci 2025;45(20):e1545242025.`,why:e=>`Six men given rising target concentrations: the order of reported changes up to unresponsiveness, from an altered body to imagery indistinguishable from the room (${e(`dream`)}; the comparison table on ${e(`cham`)}); modelled cortical dynamics grew steadily more damped (where cited).`},{who:`Sikka P, Hu S, Heifets BD.`,what:`Dreaming during anaesthesia: a scoping review.`,where:`Br J Anaesth 2026;137(2):506–24.`,why:e=>`Across 157 studies, dream recall depended largely on when people were asked; in experimental settings recall was 44–100 per cent after ketamine and 0–77 per cent after propofol; the dreams were mostly pleasant and everyday (${e(`dream`)}; the experience row on ${e(`cham`)}).`,caveat:`Scoping review.`},{who:`Alkire MT, Haier RJ, Barker SJ, et al.`,what:`Cerebral metabolism during propofol anesthesia in humans studied with positron emission tomography.`,where:`Anesthesiology 1995;82(2):393–403.`,why:e=>`Propofol anesthesia lowered whole-brain glucose metabolism by about 55 per cent, roughly halving it (${e(`two`)}).`,caveat:`Human PET.`},{who:`Purdon PL, Sampson A, Pavone KJ, Brown EN.`,what:`Clinical electroencephalography for anesthesiologists, part I.`,where:`Anesthesiology 2015;123(4):937–60.`,why:e=>`Large slow waves and frontal alpha under propofol anesthesia (${e(`two`)}).`,caveat:`Review. Citation to be re-checked against the paper.`},{who:`Pomarol-Clotet E, Honey GD, Murray GK, et al.`,what:`Psychological effects of ketamine in healthy volunteers: phenomenological study.`,where:`Br J Psychiatry 2006;189:173–9.`,why:e=>`Structured testing with the eyes open: perceptual distortions without formed hallucinations (${e(`set`)}).`,caveat:`Human placebo-controlled study. Citation to be re-checked against the paper.`},{who:`Powers AR 3rd, Gancsos MG, Finn ES, Morgan PT, Corlett PR.`,what:`Ketamine-induced hallucinations.`,where:`Psychopathology 2015;48(6):376–85.`,why:e=>`A scanner case series: vivid auditory verbal and musical hallucinations at ordinary doses (${e(`set`)}).`,caveat:`Case series.`},{who:`Kheirkhah M, et al.`,what:`Mindfulness, music, visual occlusion in ketamine therapy for depression: do they change outcomes?`,where:`Front Psychiatry 2025;16:1642025.`,why:e=>`In a randomised trial of 43 patients, adding an eye mask, music and mindfulness prompts made the experience richer and more meaningful for many without changing the antidepressant effect; the combined arm cannot isolate the eye mask (${e(`set`)}; the comparison table on ${e(`cham`)}).`,caveat:`Combined arm against ketamine only; PubMed 40964432.`},{who:`Sanders RD, Tononi G, Laureys S, Sleigh JW.`,what:`Unresponsiveness ≠ unconsciousness.`,where:`Anesthesiology 2012;116(4):946–59.`,why:e=>`The distinction between responsiveness, connection to the surroundings and experience (${e(`obs`)}, where cited).`,caveat:`Editorial review. Citation to be re-checked against the paper.`},{who:`Sinner B, Graf BM.`,what:`Ketamine.`,where:`Handb Exp Pharmacol 2008;(182):313–33.`,why:e=>`The clinical picture of ketamine anesthesia: minimally responsive to the room, the eyes often open with a wandering gaze and reflexes largely kept, the state called “dissociative” (${e(`obs`)}).`,caveat:`Review. Citation and the term “dissociative anaesthesia” confirmed 2026-09-27 (abstract); the bedside description (eyes open, wandering gaze, reflexes largely kept) is the standard clinical account and was not checked against the chapter’s full text.`},{who:`Carhart-Harris RL, Muthukumaraswamy S, Roseman L, et al.`,what:`Neural correlates of the LSD experience revealed by multimodal neuroimaging.`,where:`Proc Natl Acad Sci U S A 2016;113(17):4853–58.`,why:e=>`Under LSD, blood flow rose in visual cortex, visual alpha fell, primary visual cortex connectivity expanded and several networks lost integrity (${e(`cham`)}).`,caveat:`Human ASL fMRI and MEG; findings confirmed against the abstract 2026-09-27.`},{who:`Tagliazucchi E, Roseman L, Kaelen M, et al.`,what:`Increased global functional connectivity correlates with LSD-induced ego dissolution.`,where:`Curr Biol 2016;26(8):1043–50.`,why:e=>`Under LSD, global functional connectivity rose, in step with reported ego dissolution (${e(`cham`)}).`,caveat:`Human fMRI; confirmed against the abstract 2026-09-27: global connectivity rose in high-level association cortices and the thalamus, and communication between normally distinct networks increased.`},{who:`Vollenweider FX.`,what:`Brain mechanisms of hallucinogens and entactogens.`,where:`Dialogues Clin Neurosci 2001;3(4):265–79.`,why:e=>`Psilocybin and ketamine compared on the same altered-states questionnaire: overlapping states, with ketamine producing more anxious ego-disintegration, apathy and emotional withdrawal (${e(`cham`)}).`,caveat:`Review; confirmed against the text 2026-09-27.`},{who:`Marguilho M, Figueiredo I, Castro-Rodrigues P.`,what:`A unified model of ketamine’s dissociative and psychedelic properties.`,where:`J Psychopharmacol 2023;37(1):14–32.`,why:e=>`Ketamine’s experiences set beside those of serotonergic psychedelics: overlapping, with disembodiment more intense under ketamine and visual effects less prominent (${e(`cham`)}).`,caveat:`Review; confirmed against the text 2026-09-27.`},{who:`Ly C, Greb AC, Cameron LP, et al.`,what:`Psychedelics promote structural and functional neural plasticity.`,where:`Cell Rep 2018;23(11):3170–82.`,why:e=>`Serotonergic psychedelics, like ketamine, promoted the growth of neurites, spines and synapses (“psychoplastogens”) in cultured neurons and rodents (${e(`cham`)}).`,caveat:`Preclinical (cultured neurons, rats, flies); confirmed 2026-09-27.`},{who:`Carhart-Harris RL, Erritzoe D, Williams T, et al.`,what:`Neural correlates of the psychedelic state as determined by fMRI studies with psilocybin.`,where:`Proc Natl Acad Sci U S A 2012;109(6):2138–43.`,why:e=>`Under psilocybin, blood flow fell in hub regions (thalamus, anterior and posterior cingulate): with the LSD result, blood flow under serotonergic psychedelics depends on the region (${e(`cham`)}).`,caveat:`Human ASL and BOLD fMRI; citation confirmed by web search 2026-09-27.`},{who:`Jevtovic-Todorovic V, Hartman RE, Izumi Y, et al.`,what:`Early exposure to common anesthetic agents causes widespread neurodegeneration in the developing rat brain and persistent learning deficits.`,where:`J Neurosci 2003;23(3):876–82.`,why:e=>`Midazolam, nitrous oxide and isoflurane for six hours in seven-day-old rats: widespread apoptotic neurodegeneration and lasting learning deficits, the origin of the developing-brain concern (${e(`cham`)}).`,caveat:`Rat pups; the clinical relevance in children remains under study. Added 2026-09-27 for the other-anesthetics cell.`},{who:`Corssen G, Domino EF.`,what:`Dissociative anesthesia: further pharmacologic studies and first clinical experience with the phencyclidine derivative CI-581.`,where:`Anesth Analg 1966;45(1):29–40.`,why:`The first clinical report of ketamine (CI-581), where the label “dissociative anesthesia” was coined (where cited).`,caveat:`Historical; citation confirmed 2026-09-28 (Europe PMC). Added at the designers’ request for the label’s origin.`}];function kw(e){let t=Dw(e);return Ow.map(e=>({who:typeof e.who==`function`?e.who(t):e.who,what:e.what,where:e.where,why:typeof e.why==`function`?e.why(t):e.why,...e.caveat?{caveat:e.caveat}:{}}))}var Aw=`Schematic patch within one cortical layer. Cell numbers, connections, receptor positions and molecular sizes are illustrative, and the cell outlines are drawn for legibility, not traced from tissue. The basket cell represents one inhibitory circuit. Zoom follows the same tissue; molecular details are enlarged. Blue marks represent axonal impulses and gold marks an interneuron’s inhibitory output; orange dots represent released glutamate, drawn only in motion (arrows when animation is off or moderate). Ketamine’s label and route are shown only while each route is introduced; afterwards a purple molecule in a receptor marks the block. GO and STOP are shown one after the other at slide 4 for clarity; they act together. Animation timing and dose-band widths are illustrative. Subunit labels indicate enrichment, not exclusivity. Population symbols combine findings from separate studies, mainly in rodents; human mechanistic evidence is limited. This lesson follows Abdallah’s complementary GO/STOP pathways; Diep’s dose-graded reading is discussed at slide 5.`,jw={whole:`patch location and the release sites and impulses in it (fixed, only how often events occur changes), orange wash (blood flow up at both doses: a direction, not a map) and purple dots (the model’s block, selective at a subanesthetic dose, no longer selective at an anesthetic one)`,actRhythm:`activity textures (fine ticks: fast activity up broadly, banded ticks: fast bursts between slow waves, one whole-scalp measure, neither a map)`,actCx:`signal-diversity colours (a schematic gradient after Schartner 2017, a group statistic, not amounts, at the subanesthetic dose only, the anesthetic result a whole-scalp measure kept off the brain)`,net:`network markers or colours (identity only), within-network states (each study’s findings, placed schematically), between-network links (placement schematic, not assessed under anesthesia), line weights (directions, not sizes) and thalamus links (relationships, not tract routes)`,hier:`frontal-to-parietal arrow (its placement and width: directions, not sizes), warm sensory areas and their ring, and input arrows with the room’s eye and ear (connection to the surroundings)`,self:`TPJ and posteromedial marks, rhythm trace, body-map halo and, at the anesthetic dose, faded cortex and dotted marks (not measured)`,dream:`progression of stages (the order is Dávila 2025’s, which stages each dose emphasises is schematic)`,pci:`pulse site and ripples (complexity, not size or path) and any chips or dot tallies (categories and counts, not amounts)`,two:`ketamine–propofol contrasts (categories, not amounts)`,set:`setting summaries and surroundings-to-inside strip (a schematic direction, no numbers)`,obs:`observer’s-view figures (schematic, not a measured posture)`,cham:`comparison table (categories from separate studies, not amounts)`,answer:`chip tones (categories)`},Mw=`Every EEG trace is drawn, not recorded, with frequencies scaled for legibility, and the anesthetic timeline’s timing is illustrative. Cards, tables and panels give directions, never a shared magnitude. These mechanisms help explain why the effects change with dose; they do not set exact clinical boundaries. Scope: the Chameleon review’s Figure 2 is the lesson’s scaffold, and primary studies govern where it compresses them (blood flow, complexity, neurotoxicity). Left out: ketamine’s dose-dependent effects on norepinephrine, which the review links to wakefulness and, at higher doses, to anesthetic effects.`;function Nw(e,t,n,r,i){let[a,o]=tw[e].brainRange,s=n.filter(e=>e.clauses.length).map(e=>`slide ${e.no}’s ${e.clauses.join(`, its `)}`),c=i??[jw.answer],l=c.length?`; the summary’s ${c.join(`, its `)}`:``,u=r===`legend`?`the legends, keys and tooltips, which name these marks`:`each brain slide’s ${r}, which names these marks`;return`${Aw} Slides ${a}–${o} draw ${t}. Drawn, not measured: ${s.join(`; `)}${l}; and ${u}. ${Mw}`}var Pw=e=>e.filter(e=>e!==`answer`).map(e=>jw[e]),Fw=[{id:`intro`,nav:`The Paradox`,title:`The Paradox and the Dose Problem`,body:`Ketamine blocks NMDA receptors for
